version = 1

# Cargo generates the lockfile, and its format has no place for a header.
[[annotations]]
path = ["Cargo.lock", "desktop/Cargo.lock"]
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# openapi-to-rust generates these files from api/openapi.yaml, and CI fails
# when they differ from its output, so they cannot carry a header of ours.
[[annotations]]
path = "crates/torrplay-api/src/generated/**"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# A video cannot carry a header. ffmpeg generated it from its own test sources:
# ffmpeg -f lavfi -i "testsrc2=size=160x90:rate=12:duration=20" -f lavfi -i "sine=frequency=330:duration=20" -c:v libvpx-vp9 -b:v 24k -g 24 -c:a libopus -b:a 16k -ac 1 test-pattern.webm
[[annotations]]
path = "client/e2e/fixtures/test-pattern.webm"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# The demo's generated media: a video and an image cannot carry a header, and
# a subtitle file shows whatever it holds. client/scripts/demo-posters.mjs draws
# the posters. ffmpeg generated the video from its test sources:
# ffmpeg -f lavfi -i "testsrc2=size=320x180:rate=12:duration=30" -f lavfi -i "sine=frequency=262:duration=30" -f lavfi -i "sine=frequency=392:duration=30" -map 0 -map 1 -map 2 -c:v libvpx-vp9 -b:v 40k -g 24 -c:a libopus -b:a 16k -ac 1 -metadata:s:a:0 language=eng -metadata:s:a:1 language=rus -disposition:a:0 default sample.webm
[[annotations]]
path = "client/public/demo-media/**"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# JSON Lines has no comment syntax for a header.
[[annotations]]
path = "bench/traces/*.jsonl"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# JSON has no comment syntax for a header.
[[annotations]]
path = "fixtures/*.json"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# Scalar's standalone API reference bundle, vendored gzipped by
# scripts/update-scalar.sh. Scalar is MIT; the bundle also compiles in its
# dependencies, whose licenses this lists. A minified, compressed file
# cannot carry a header, and the digest file is the script's output.
[[annotations]]
path = "crates/torrplay-server/assets/scalar/**"
SPDX-FileCopyrightText = [
  "2023-present Scalar",
  "The authors of the libraries Scalar bundles",
]
SPDX-License-Identifier = "MIT AND Apache-2.0 AND ISC AND BSD-3-Clause AND BSD-2-Clause AND 0BSD"

# The DLNA media server's icons, which scripts/render-logo.py draws; image
# formats have no place for a header.
[[annotations]]
path = "crates/torrplay-server/assets/dlna/icon-*"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# The web client's manifests: JSON has no comment syntax, pnpm writes the
# lockfile, and the Node version file holds the version alone.
[[annotations]]
path = [
  "client/.node-version",
  "client/package.json",
  "client/pnpm-lock.yaml",
  "client/tsconfig.json",
]
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# openapi-typescript generates the client's API types from api/openapi.yaml,
# and CI fails when they differ from its output.
[[annotations]]
path = "client/src/lib/api/schema.d.ts"
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"

# Tauri reads the desktop app's configuration as JSON, which has no comments, and
# generates the schemas under gen, which Git ignores. Its icon is
# client/public/favicon.svg rendered as an image, which has no place for a header.
[[annotations]]
path = ["desktop/tauri.conf.json", "desktop/icons/*", "desktop/gen/**"]
SPDX-FileCopyrightText = "2026 TorrPlay"
SPDX-License-Identifier = "MIT"
