[workspace]
resolver = "3"
members = [
    "crates/torrplay-api",
    "crates/torrplay-contract",
    "crates/torrplay-core",
    "crates/torrplay-engine",
    "crates/torrplay-fixtures",
    "crates/torrplay-server",
    "spikes/engine-spike",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/skunkie/torrplay-rs"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "tokio"] }
bytes = "1"
# Without default features it does not read the system clock or time zone.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
form_urlencoded = "1"
getrandom = { version = "0.3.4", features = ["std"] }
http = "1"
http-body-util = "0.1"
# Without default features it never fetches remote references.
jsonschema = { version = "0.59", default-features = false }
# librqbit from the torrplay/patches branch of the skunkie/rqbit fork: the
# unreleased upstream revision 57e95d16 plus TorrPlay's patches, one commit
# each. docs/adr/0002-engine-selection.md records why, and
# docs/development.md how to update it. TLS uses rustls so builds do not
# depend on a system OpenSSL.
librqbit = { git = "https://github.com/skunkie/rqbit", rev = "e724f259a39784a4d287e07382e04f626ea3f998", default-features = false, features = ["rust-tls"] }
librqbit-core = { git = "https://github.com/skunkie/rqbit", rev = "e724f259a39784a4d287e07382e04f626ea3f998", default-features = false }
memchr = "2"
# Tests reach the server over loopback HTTP only, so they need no TLS.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
torrplay-api = { path = "crates/torrplay-api" }
torrplay-contract = { path = "crates/torrplay-contract" }
torrplay-core = { path = "crates/torrplay-core" }
torrplay-fixtures = { path = "crates/torrplay-fixtures" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = { version = "2", features = ["serde"] }
