[workspace]
resolver = "3"
members = ["crates/torrplay-fixtures", "spikes/engine-spike"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/skunkie/torrplay-rs"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
# librqbit at an unreleased main revision that carries fixes the spike needs;
# docs/adr/0002-engine-selection.md records why. TLS uses rustls so builds do
# not depend on a system OpenSSL.
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "57e95d16c830863a1fde32d8fa98153b53a3d0b4", default-features = false, features = ["rust-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
torrplay-fixtures = { path = "crates/torrplay-fixtures" }
