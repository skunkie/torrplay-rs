[workspace]
resolver = "3"
members = ["crates/torrplay-engine", "crates/torrplay-fixtures", "spikes/engine-spike"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/skunkie/torrplay-rs"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
# librqbit from the torrplay/patches branch of the skunkie/rqbit fork: the
# unreleased upstream revision 57e95d16 plus the spike's patches, one commit
# each. docs/adr/0002-engine-selection.md records why, and
# docs/development.md how to update it. TLS uses rustls so builds do not
# depend on a system OpenSSL.
librqbit = { git = "https://github.com/skunkie/rqbit", rev = "b5de742fff831b46f156ea69257f5a4f0e1ec11e", default-features = false, features = ["rust-tls"] }
librqbit-core = { git = "https://github.com/skunkie/rqbit", rev = "b5de742fff831b46f156ea69257f5a4f0e1ec11e", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
torrplay-fixtures = { path = "crates/torrplay-fixtures" }
