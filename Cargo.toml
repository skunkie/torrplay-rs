[workspace]
resolver = "3"
members = [
    "crates/torrplay",
    "crates/torrplay-api",
    "crates/torrplay-bench",
    "crates/torrplay-contract",
    "crates/torrplay-core",
    "crates/torrplay-engine",
    "crates/torrplay-fixtures",
    "crates/torrplay-server",
    "crates/torrplay-store",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/skunkie/torrplay-rs"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "warn"
unwrap_used = "warn"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "matched-path", "tokio"] }
# librqbit's bencode, from the same fork commit, to recognize v2-only
# torrents librqbit cannot parse.
bencode = { package = "librqbit-bencode", git = "https://github.com/skunkie/rqbit", rev = "fa0185ebc45080685a925734ad7bbd5426acbbfa" }
bytes = "1"
# Without default features it does not read the system clock or time zone.
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
# The platform's data directory, the default for the database; librqbit
# already depends on it.
directories = "6"
form_urlencoded = "1"
# Only for TryStreamExt, which axum already depends on.
futures-util = { version = "0.3", default-features = false }
# Free space on the download directory's filesystem, without unsafe code.
fs4 = "1.1"
getrandom = { version = "0.3.4", features = ["std"] }
# The HTTP/2 reset reasons hyper reads from stream errors.
h2 = "0.4"
http = "1"
http-body-util = "0.1"
# Full case folding for search, from the same ICU4X release as the
# normalizer, since the standard library only lowercases.
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Unicode normalization, already in the tree through url, for comparing
# disk paths as case-insensitive filesystems do, for library text, and for
# search.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Unicode general categories for search's word splitting, already in the
# tree through url.
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Without default features it never fetches remote references.
jsonschema = { version = "0.59", default-features = false }
# librqbit from the torrplay/patches branch of the skunkie/rqbit fork: the
# unreleased upstream revision 57e95d16 plus TorrPlay's patches, one commit
# each. docs/adr/0002-engine-selection.md records why, and
# docs/development.md how to update it. TLS uses rustls so builds do not
# depend on a system OpenSSL.
librqbit = { git = "https://github.com/skunkie/rqbit", rev = "fa0185ebc45080685a925734ad7bbd5426acbbfa", default-features = false, features = ["rust-tls"] }
librqbit-core = { git = "https://github.com/skunkie/rqbit", rev = "fa0185ebc45080685a925734ad7bbd5426acbbfa", default-features = false }
memchr = "2"
# Tests reach the server over loopback HTTP only, so they need no TLS.
reqwest = { version = "0.13", default-features = false }
# The database ADR 8 chose, compiled from the bundled amalgamation so builds
# do not depend on a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
torrplay-api = { path = "crates/torrplay-api" }
torrplay-contract = { path = "crates/torrplay-contract" }
torrplay-core = { path = "crates/torrplay-core" }
torrplay-engine = { path = "crates/torrplay-engine" }
torrplay-fixtures = { path = "crates/torrplay-fixtures" }
torrplay-server = { path = "crates/torrplay-server" }
torrplay-store = { path = "crates/torrplay-store" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
url = { version = "2", features = ["serde"] }

# Dev builds keep only line tables, enough for backtraces with file and line,
# which cuts each test binary that links librqbit almost threefold.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized in dev builds. Unoptimized, librqbit's session
# setup alone needs over 1 MiB of stack, most of a 2 MiB test thread, and
# overflowed it on macOS; optimized, it needs under 256 KiB. TorrPlay's own
# crates stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 1
