# The ruleset vacuum lints api/openapi.yaml against. CI fails on any
# finding through a minimum score of 100.

# The OWASP rules are off but for the ones enabled below, since most ask for
# what a loopback-only prototype does not have yet, such as authentication
# and rate limits.
extends: [['vacuum:oas', recommended], ['vacuum:owasp', off]]

rules:
  # JSON fields are snake_case; torrplay-property-snake-case checks them.
  camel-case-properties: off

  info-license: true
  openapi-tags: true
  operation-singular-tag: true
  # A client generator sizes an integer by its format, and without one picks
  # a width that may be too narrow for a byte count or a rate.
  owasp-integer-format: true
  required-fields-defined: true
  tag-description: true

  torrplay-description-sentence:
    description: A description is sentences ending in a period.
    severity: warn
    # A schema is found by the key it sits under, which reaches every nested
    # schema but none of the example data under examples, whose own
    # description fields are not prose.
    given:
      - $.info.description
      - $.tags[*].description
      - $.paths[*][*].description
      - $.paths[*][*].parameters[*].description
      - $.paths[*][*].responses[*].description
      - $.components.parameters[*].description
      - $.components.responses[*].description
      - $.components.schemas[*].description
      - $..schema.description
      - $..properties[*].description
      - $..items.description
    then:
      function: pattern
      functionOptions:
        match: '\.\s*$'

  # vacuum validates an example's `value` against its schema but does not
  # read the `dataValue` and `serializedValue` fields OpenAPI 3.2 added, so
  # an example written with them would go unchecked.
  torrplay-example-value:
    description: An example carries its data in value, which vacuum validates.
    severity: warn
    given: $..examples[*]
    then:
      - field: dataValue
        function: falsy
      - field: serializedValue
        function: falsy

  torrplay-operation-id-camel:
    description: An operationId is lowerCamelCase.
    severity: warn
    given: $.paths[*][*].operationId
    then:
      function: casing
      functionOptions:
        type: camel

  # The recommended paths-kebab-case rule checks the literal path segments.
  torrplay-parameter-snake-case:
    description: A path or query parameter is snake_case.
    severity: warn
    given: $..parameters[?(@.in == 'path' || @.in == 'query')].name
    then:
      function: casing
      functionOptions:
        type: snake

  torrplay-property-snake-case:
    description: A JSON field is snake_case.
    severity: warn
    given: $..properties
    then:
      field: '@key'
      function: casing
      functionOptions:
        type: snake

  torrplay-summary-no-period:
    description: A summary is a phrase without a trailing period.
    severity: warn
    given: $.paths[*][*].summary
    then:
      function: pattern
      functionOptions:
        notMatch: '\.\s*$'

  torrplay-tag-title-case:
    description: A tag is a noun in title case.
    severity: warn
    given: $.tags[*].name
    then:
      function: pattern
      functionOptions:
        match: '^[A-Z][A-Za-z0-9]*( [A-Z0-9][A-Za-z0-9]*)*$'
