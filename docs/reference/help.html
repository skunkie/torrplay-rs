<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: Canvas;
      --text: CanvasText;
      --muted: CanvasText;
      --accent: LinkText;
      --border: ButtonBorder;
      --panel: Canvas;
      --code: Canvas;
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --surface: light-dark(#f8fafc, #0f172a);
        --text: light-dark(#0f172a, #f1f5f9);
        --muted: light-dark(#475569, #a6b5c9);
        --accent: light-dark(#0369a1, #7dd3fc);
        --border: light-dark(#dbe4ef, #334155);
        --panel: light-dark(#ffffff, #142035);
        --code: light-dark(#eef2f7, #1e293b);
      }
    }

    @supports (color: light-dark(white, black)) and selector(:has(*)) {
      :root:has(#help-theme-light:checked) { color-scheme: light; }
      :root:has(#help-theme-dark:checked) { color-scheme: dark; }
    }

    * { box-sizing: border-box; }
    html { background: var(--surface); color: var(--text); }
    body {
      display: grid;
      grid-template-columns: 13rem minmax(0, 1fr);
      column-gap: clamp(1.5rem, 4vw, 3rem);
      align-items: start;
      max-width: 73rem;
      margin: 0 auto;
      padding: 0 clamp(1rem, 4vw, 3rem) 4rem;
      font: 1rem/1.6 system-ui, sans-serif;
    }

    a { color: var(--accent); text-underline-offset: .18em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .skip-link {
      position: fixed;
      z-index: 1;
      inset-block-start: .75rem;
      inset-inline-start: .75rem;
      padding: .5rem .75rem;
      background: var(--panel);
      transform: translateY(-200%);
    }
    .skip-link:focus { transform: none; }

    .masthead {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: .25rem clamp(.75rem, 3vw, 1.5rem);
      padding: 2rem 0 .6rem;
      margin-block-end: 1.8rem;
      border-block-end: 1px solid var(--border);
    }
    h1, h2 { line-height: 1.2; letter-spacing: -.025em; }
    h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 3rem); }
    header { min-inline-size: 0; overflow-wrap: anywhere; }
    header p { margin: .4rem 0 0; color: var(--muted); font-size: .9rem; }

    .theme-picker {
      display: none;
      position: relative;
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }
    .theme-picker legend, .theme-picker input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: 0;
      padding: 0;
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }
    .theme-icon {
      display: none;
      place-items: center;
      inline-size: 2.75rem;
      block-size: 2.75rem;
      border: 1px solid var(--border);
      border-radius: .65rem;
      background: var(--panel);
      color: var(--accent);
      cursor: pointer;
    }
    .theme-icon svg {
      inline-size: 1.5rem;
      block-size: 1.5rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-icon:hover { background: var(--code); }
    .theme-picker:has(input:focus-visible) .theme-icon {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .theme-hint {
      display: none;
      grid-column: 1 / -1;
      justify-self: end;
      margin: 0;
      color: var(--muted);
      font-size: .8125rem;
      line-height: 1.3;
      visibility: hidden;
    }
    .theme-picker:has(input:focus-visible) + .theme-hint { visibility: visible; }
    @supports (color: light-dark(white, black)) and selector(:has(*)) {
      .theme-picker { display: block; }
      /* Reserve the hint's space so changing focus keeps links in place. */
      .theme-hint { display: block; }
      #help-theme-system:checked ~ .theme-system,
      #help-theme-light:checked ~ .theme-light,
      #help-theme-dark:checked ~ .theme-dark { display: grid; }
    }

    nav {
      position: sticky;
      top: 1rem;
      max-height: calc(100vh - 2rem);
      overflow: auto;
      padding: .65rem .8rem;
      background: var(--panel);
      border-inline-start: 3px solid var(--accent);
      border-radius: 0 .65rem .65rem 0;
    }
    nav ul { margin: 0; padding: 0; list-style: none; }
    nav ul ul { padding-inline-start: 1rem; }
    nav a { display: block; padding-block: .3rem; font-size: .9rem; }
    main { min-width: 0; max-width: 46rem; overflow-wrap: anywhere; }
    main [id] { scroll-margin-block-start: 1rem; }
    h2 { margin-block: 2.5rem .75rem; font-size: 1.65rem; }
    h2:first-child { margin-block-start: 0; }
    code, pre { font-family: ui-monospace, monospace; }
    code { overflow-wrap: anywhere; font-size: .9em; }
    pre {
      overflow: auto;
      padding: .85rem 1rem;
      border: 1px solid var(--border);
      border-radius: .65rem;
      background: var(--code);
    }
    pre code { overflow-wrap: normal; }
    dt { margin-block-start: .9rem; }
    dd { margin-inline-start: 1rem; }

    @media (max-width: 44rem) {
      body { grid-template-columns: minmax(0, 1fr); row-gap: 1.5rem; }
      .masthead { margin-block-end: 0; }
      nav { position: static; max-height: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#reference-content">Skip to content</a>
  <div class="masthead">
    <header>
      <h1>$title$</h1>
      <p>Version $version$ · $platform$</p>
    </header>
    <fieldset class="theme-picker" aria-describedby="theme-hint">
      <legend>Theme</legend>
      <input type="radio" name="help-theme" id="help-theme-system" aria-label="System" checked>
      <input type="radio" name="help-theme" id="help-theme-light" aria-label="Light">
      <input type="radio" name="help-theme" id="help-theme-dark" aria-label="Dark">
      <label class="theme-icon theme-system" for="help-theme-light" aria-hidden="true" title="System theme. Switch to light.">
        <svg viewBox="0 0 24 24"><path d="$icon-system$"/></svg>
      </label>
      <label class="theme-icon theme-light" for="help-theme-dark" aria-hidden="true" title="Light theme. Switch to dark.">
        <svg viewBox="0 0 24 24"><path d="$icon-sun$"/></svg>
      </label>
      <label class="theme-icon theme-dark" for="help-theme-system" aria-hidden="true" title="Dark theme. Follow the system.">
        <svg viewBox="0 0 24 24"><path d="$icon-moon$"/></svg>
      </label>
    </fieldset>
    <p class="theme-hint" id="theme-hint">Use the arrow keys to change the theme.</p>
  </div>
  <nav aria-label="Contents">
    $table-of-contents$
  </nav>
  <main id="reference-content" tabindex="-1">
$body$
  </main>
</body>
</html>
