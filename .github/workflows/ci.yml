name: CI
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  macos-package:
    name: Capture the tested DMG with both Finder bars
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-macos-universal
          path: target/dmg
          github-token: ${{ github.token }}
          run-id: 46016048993
      - name: Capture the mounted disk image in Finder
        id: capture-finder
        run: |
          scratch=$(mktemp -d "${RUNNER_TEMP}/torrplay-finder.XXXXXX")
          mount="$scratch/TorrPlay"
          mkdir "$mount"
          hdiutil attach -readonly -noautoopen -mountpoint "$mount" target/dmg/TorrPlay.dmg <<< Y
          trap 'hdiutil detach "$mount"' EXIT
          cat > "$scratch/window.swift" <<'SWIFT'
          import CoreGraphics

          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID)
              as? [[String: Any]] ?? []
          for window in windows {
              guard window[kCGWindowOwnerName as String] as? String == "Finder",
                    window[kCGWindowName as String] as? String == "TorrPlay",
                    window[kCGWindowLayer as String] as? Int == 0,
                    let id = window[kCGWindowNumber as String] as? Int else { continue }
              print(id)
              break
          }
          SWIFT
          swiftc "$scratch/window.swift" -o "$scratch/window"
          defaults write -g AppleShowScrollBars -string Always
          /usr/bin/osascript -e 'tell application "System Events" to set dark mode of appearance preferences to true'
          killall Finder
          sleep 2
          open "$mount"
          window=""
          for _ in {1..20}; do
            window=$("$scratch/window")
            if [[ -n "$window" ]]; then
              break
            fi
            sleep 1
          done
          [[ -n "$window" ]] || { echo "::error::Finder did not expose the mounted TorrPlay window"; exit 1; }
          sleep 15
          screencapture -x -o -l "$window" target/dmg/TorrPlay-Finder.png
          test -s target/dmg/TorrPlay-Finder.png
          /usr/bin/osascript <<'APPLESCRIPT'
          tell application "System Events"
              tell process "Finder"
                  set frontmost to true
                  keystroke "p" using {option down, command down}
                  delay 1
                  keystroke "/" using {command down}
              end tell
          end tell
          APPLESCRIPT
          sleep 5
          screencapture -x -o -l "$window" target/dmg/TorrPlay-Finder-With-Bars.png
          test -s target/dmg/TorrPlay-Finder-With-Bars.png
      - name: Upload the Finder screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torrplay-dmg-finder
          path: target/dmg/TorrPlay-Finder*.png
          if-no-files-found: error
          retention-days: 7
