name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stage:
    name: Repository stage
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.project.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the Cargo project
        id: project
        shell: bash
        run: |
          if [[ -f Cargo.toml ]]; then
            for required in Cargo.lock rust-toolchain.toml; do
              if [[ ! -f "$required" ]]; then
                echo "::error::Cargo.toml requires a committed $required"
                exit 1
              fi
            done
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            rust_sources=$(git ls-files '*.rs' '**/Cargo.toml')
            if [[ -n "$rust_sources" ]]; then
              echo "::error::Rust sources require a root Cargo.toml"
              exit 1
            fi
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Planning stage: Cargo checks start with the root manifest."
          fi

  licensing:
    name: REUSE lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  workflows:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        shell: bash
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - name: Install actionlint
        shell: bash
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Lint workflows and shell scripts
        shell: bash
        run: |
          test "$(shellcheck --version | sed -n 's/^version: //p')" = "${SHELLCHECK_VERSION#v}"
          "${RUNNER_TEMP}/actionlint" -color
          shellcheck scripts/*.sh packaging/linux/preinst

  service:
    name: Linux service files
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the unit and the sysusers.d entry
        shell: bash
        run: scripts/check-linux-service.sh

  windows-service:
    name: Windows service
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
      # Optimized and without the tests' features, as what ships is; without the
      # embedded web client, which needs the client's build and which the
      # service test does not open.
      - name: Build the application
        run: cargo build --release --locked -p torrplay --no-default-features
      # The service's code builds only on Windows, which the quality job does
      # not lint. Only what the build above compiles, with its profile and
      # features, rather than the tests and their dependencies too.
      - name: Lint the Windows service
        run: cargo clippy --release --locked -p torrplay -p torrplay-settings-file --no-default-features -- -D warnings
      # The runner is disposable and elevated, so the test installs the service
      # on it.
      - name: Install and test the service
        shell: pwsh
        run: scripts/test-windows-service.ps1 target/release/torrplay.exe

  service-package:
    name: Linux service packages
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    # The oldest supported system, as ADR 13 decides: a binary needs the C
    # library and WebKitGTK it was linked against or newer.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Corepack fetches the pnpm release package.json names and checks it
      # against the SHA-512 written there.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # A release at least two weeks old; cargo verifies the crate against the
      # registry's checksum, and --locked builds its own lockfile.
      CARGO_DEB_VERSION: 3.8.0
      # A release at least two weeks old, with the SHA-256 GitHub publishes for
      # the archive.
      PANDOC_VERSION: 3.12.1
      PANDOC_SHA256: d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
          cache-workspaces: |
            .
            desktop
      - name: Install WebKitGTK and the desktop entry validator
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            desktop-file-utils
      - name: Enable pnpm
        working-directory: client
        run: corepack enable pnpm
      - name: Install the web client's dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build the web client
        working-directory: client
        run: pnpm build
      - name: Build the service
        run: cargo build --release --locked -p torrplay
      # Into a directory of its own, where the package takes it from.
      - name: Build the client
        working-directory: desktop
        run: cargo build --release --locked --no-default-features --features client --target-dir target/client
      - name: Install cargo-deb
        run: cargo install cargo-deb --version "${CARGO_DEB_VERSION}" --locked
      - name: Install pandoc
        run: scripts/install-pandoc.sh "${PANDOC_VERSION}" "${PANDOC_SHA256}" "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - name: Render the manual pages
        run: scripts/build-man-pages.sh target/man
      - name: Build the packages
        run: |
          cargo deb --no-build --locked -p torrplay --output target/debian/torrplay-service.deb
          cargo deb --no-build --locked --manifest-path desktop/Cargo.toml --output target/debian/torrplay-client.deb
      # The runner is disposable, so the test installs the packages on it.
      - name: Install and test the packages
        run: scripts/test-linux-service.sh --package target/debian/torrplay-service.deb target/debian/torrplay-client.deb

  application-package:
    name: Application packages (Linux)
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    # The oldest supported system, as ADR 13 decides.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Releases at least two weeks old: cargo verifies the crate against the
      # registry's checksum, and pandoc's archive against the SHA-256 GitHub
      # publishes. The CLI matches the tauri crate's minor version.
      TAURI_CLI_VERSION: 2.12.4
      PANDOC_VERSION: 3.12.1
      PANDOC_SHA256: d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
          cache-workspaces: |
            .
            desktop
      # Ubuntu 24.04 names WebKit's WebDriver webkit2gtk-driver, as Debian does;
      # later releases call it webkitgtk-webdriver.
      - name: Install WebKitGTK and what the smoke test drives it with
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            desktop-file-utils webkit2gtk-driver xvfb dbus-daemon python3-gi \
            gir1.2-gtk-3.0 gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav patchelf gir1.2-gstreamer-1.0
      - name: Enable pnpm
        working-directory: client
        run: corepack enable pnpm
      - name: Install the web client's dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build the web client
        working-directory: client
        run: pnpm build
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked
      - name: Install pandoc
        run: scripts/install-pandoc.sh "${PANDOC_VERSION}" "${PANDOC_SHA256}" "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      # The script checks each AppImage tool it downloads against a pinned
      # SHA-256.
      - name: Build the packages
        run: scripts/build-application-linux.sh target/debian/torrplay.deb target/appimage/torrplay.AppImage
      # The runner is disposable, so the test installs the package on it.
      - name: Install and check the package
        run: scripts/test-application-deb.sh --keep target/debian/torrplay.deb
      - name: Run the smoke test on the installed application
        working-directory: desktop
        run: dbus-run-session -- python3 tests/smoke.py /usr/bin/torrplay-desktop
      - name: Remove the package
        run: scripts/test-application-deb.sh target/debian/torrplay.deb
      - name: Check the AppImage
        run: scripts/test-application-appimage.sh target/appimage/torrplay.AppImage "${RUNNER_TEMP}/appimage"
      # The unpacked AppImage, started as its runtime would, without the FUSE
      # mount the runner lacks, and with the .deb removed.
      - name: Run the smoke test on the AppImage
        working-directory: desktop
        run: dbus-run-session -- python3 tests/smoke.py "${RUNNER_TEMP}/appimage/run"

  application-installer:
    name: Application installer (${{ matrix.os }})
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Windows Server for x86_64, which has no hosted Windows 11 image, and
      # Windows 11 for arm64, as ADR 13 decides.
      matrix:
        os:
          - windows-latest
          - windows-11-arm
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # A release at least two weeks old; cargo verifies the crate against the
      # registry's checksum. The CLI matches the tauri crate's minor version.
      TAURI_CLI_VERSION: 2.12.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
          cache-workspaces: |
            .
            desktop
      - name: Enable pnpm
        working-directory: client
        run: corepack enable pnpm
      - name: Install the web client's dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build the web client
        working-directory: client
        run: pnpm build
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "${env:TAURI_CLI_VERSION}" --locked
      - name: Build the installer
        shell: pwsh
        run: scripts/build-application-nsis.ps1 target/nsis/torrplay-setup.exe
      # The runner is disposable and elevated, so the test installs the
      # application on it.
      - name: Install, run, and uninstall the application
        shell: pwsh
        run: scripts/test-application-nsis.ps1 target/nsis/torrplay-setup.exe

  service-live:
    name: Linux service
    needs: browser
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torrplay-linux
          path: ${{ runner.temp }}/build
      # The runner is disposable, so the test installs the service on it.
      - name: Install and test the service
        shell: bash
        run: |
          systemctl --version | head -n 1
          chmod +x "${RUNNER_TEMP}/build/torrplay"
          scripts/test-linux-service.sh "${RUNNER_TEMP}/build/torrplay"

  contract:
    name: API contract lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Pinned by digest, since it runs against the checked-out repository,
      # to a release at least two weeks old, so a broken or compromised
      # release has time to be found and withdrawn before CI runs it.
      VACUUM_IMAGE: dshanley/vacuum:v0.30.6@sha256:e13b08c36d5858753cafe677282bb38d9b7ca7945f3a3afba403ed47520dc5af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the project's vacuum rules
        shell: bash
        run: scripts/check-vacuum-rules.sh docker run --rm -v "${PWD}:/work:ro" "${VACUUM_IMAGE}"
      # Any warning or info finding costs a point, so a minimum score of 100
      # fails on every finding. The rules check above holds that to be true.
      - name: Lint the specification and validate its examples
        if: hashFiles('api/openapi.yaml') != ''
        shell: bash
        run: docker run --rm -v "${PWD}:/work:ro" "${VACUUM_IMAGE}" lint -r .vacuum.yml --ignore-file .vacuum-ignore.yml --min-score 100 -d -b api/openapi.yaml

  client:
    name: Web client
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      # Corepack fetches the pnpm release package.json names and checks it
      # against the SHA-512 written there.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the generated API types
        run: |
          pnpm generate
          git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Type-check
        run: pnpm check
      - name: Lint and check formatting
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build the production bundle
        run: pnpm build

  quality:
    name: Rust quality
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          build-warnings: warn
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all workspace targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  desktop:
    name: Desktop application (ubuntu-26.04)
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Corepack fetches the pnpm release package.json names and checks it
      # against the SHA-512 written there.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          build-warnings: warn
          cache-workspaces: desktop
      - name: Install WebKitGTK and what the smoke test drives it with
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev \
            webkitgtk-webdriver xvfb dbus-daemon python3-gi gir1.2-gtk-3.0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the client
        run: cargo clippy --locked --all-targets --no-default-features --features client -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test the client
        run: cargo test --locked --no-default-features --features client
      - name: Enable pnpm
        working-directory: client
        run: corepack enable pnpm
      - name: Install the client's dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build the client
        working-directory: client
        run: pnpm build
      # A release build embeds the client, as what ships does.
      - name: Build the application
        run: cargo build --release --locked
      - name: Run the smoke test
        run: dbus-run-session -- python3 tests/smoke.py target/release/torrplay-desktop
      # The service edition's client, built in place of the application.
      - name: Build the client
        run: cargo build --release --locked --no-default-features --features client
      - name: Run the client's smoke test
        run: dbus-run-session -- python3 tests/client_smoke.py target/release/torrplay-desktop

  macos-icon:
    name: macOS application icon
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    # Xcode 26's actool compiles the Icon Composer icon; earlier ones cannot.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # A release at least two weeks old; cargo verifies the crate against the
      # registry's checksum. The CLI matches the tauri crate's minor version.
      TAURI_CLI_VERSION: 2.12.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
          cache-workspaces: desktop
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked
      # A debug build bundles the same icons without the web client, which it
      # reads at run time, and without torrplay beside it, which only the
      # packaging overlay adds.
      - name: Bundle the application
        working-directory: desktop
        run: cargo tauri build --debug --bundles app --config '{"bundle":{"active":true}}' -- --locked
      - name: Check its icons
        run: scripts/check-macos-icon.sh desktop/target/debug/bundle/macos/TorrPlay.app

  desktop-platforms:
    name: Desktop application (${{ matrix.os }})
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
          cache-workspaces: desktop
      - name: Test
        run: cargo test --locked
      - name: Test the client
        run: cargo test --locked --no-default-features --features client

  generated:
    name: Generated wire types
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # A release at least two weeks old. Cargo verifies the crate against
      # the registry's checksum, and --locked builds its own lockfile.
      OPENAPI_TO_RUST_VERSION: 0.20.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
      - name: Install openapi-to-rust
        shell: bash
        run: |
          cargo install --locked --version "${OPENAPI_TO_RUST_VERSION}" --root "${RUNNER_TEMP}/openapi-to-rust" openapi-to-rust
          echo "${RUNNER_TEMP}/openapi-to-rust/bin" >> "$GITHUB_PATH"
      - name: Check the generated files against the contract
        working-directory: crates/torrplay-api
        run: openapi-to-rust generate --check

  dependencies:
    name: Dependency policy
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
      - name: Install cargo-deny
        shell: bash
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 --retry-all-errors -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${name}" >> "$GITHUB_PATH"
      - name: Check licenses, advisories, bans, and sources
        run: cargo-deny --locked check
      - name: Check that the desktop application's policy follows the root's
        run: scripts/check-desktop-deny.sh
      - name: Check the desktop application's dependencies
        run: cargo-deny --manifest-path desktop/Cargo.toml --locked check

  browser:
    name: Browser smoke test
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      # Corepack fetches the pnpm release package.json names and checks it
      # against the SHA-512 written there.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.node-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install the client's dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Build the client
        working-directory: client
        run: pnpm build
      # A release build embeds the client, as what ships does; a debug build
      # reads it from the disk.
      - name: Build the application and the local tracker
        run: cargo build --release --locked -p torrplay -p torrplay-bench
      # Chrome and aria2 come from the runner's image and Ubuntu's signed
      # archive, at no pinned version, since the archive drops superseded
      # versions and an old browser is the larger risk. This logs both.
      - name: Install the local seeder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends aria2
      - name: Test in the runner's Chrome
        working-directory: client
        env:
          TORRPLAY_BIN_DIR: ${{ github.workspace }}/target/release
        run: |
          google-chrome --version
          aria2c --version | head -n 1
          pnpm test:browser
      # The service test runs this build as the system service.
      - name: Keep the application for the Linux service test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torrplay-linux
          path: target/release/torrplay
          retention-days: 1
          if-no-files-found: error
      - name: Keep the traces and logs of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-test
          path: |
            client/test-results
            client/test-logs
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Rust build and tests (${{ matrix.os }})
    needs: stage
    if: needs.stage.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          build-warnings: warn
      - name: Build default features
        run: cargo build --locked --workspace --all-targets
      - name: Test default features
        run: cargo test --locked --workspace
      - name: Test all features
        run: cargo test --locked --workspace --all-features
