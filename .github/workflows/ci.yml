name: CI
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  macos-package:
    name: Package and capture the resized DMG
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-macos-universal
          path: ${{ runner.temp }}/previous-dmg
          github-token: ${{ github.token }}
          run-id: 46012821346
      - name: Install dmgbuild
        run: |
          python3 -m venv "${RUNNER_TEMP}/dmgbuild"
          "${RUNNER_TEMP}/dmgbuild/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r packaging/macos/dmg-requirements.txt
          echo "${RUNNER_TEMP}/dmgbuild/bin" >> "$GITHUB_PATH"
      - name: Repackage the verified universal application
        run: |
          scratch=$(mktemp -d "${RUNNER_TEMP}/torrplay-repack.XXXXXX")
          mount="$scratch/input"
          mkdir -p "$mount" target/dmg target/notices
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount"             "${RUNNER_TEMP}/previous-dmg/TorrPlay.dmg" <<< Y
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/TorrPlay.app" "$scratch/TorrPlay.app"
          cp "$mount/TorrPlay.app/Contents/Resources/THIRD-PARTY-NOTICES.txt"             target/notices/THIRD-PARTY-NOTICES.txt
          hdiutil detach "$mount"
          trap - EXIT
          dmgbuild -s packaging/macos/dmg-settings.py -D app="$scratch/TorrPlay.app" TorrPlay target/dmg/TorrPlay.dmg
      - name: Check and run the packaged application
        run: |
          mount=$(mktemp -d "${RUNNER_TEMP}/torrplay-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" target/dmg/TorrPlay.dmg <<< Y
          trap 'hdiutil detach "$mount"' EXIT
          python3 tests/check_macos_dmg_layout.py "$mount"
          cmp desktop/icons/icon.icns "$mount/.VolumeIcon.icns"
          app="$mount/TorrPlay.app"
          scripts/check-macos-icon.sh "$app"
          codesign --verify --deep --strict "$app"
          cmp LICENSES/MIT.txt "$app/Contents/Resources/LICENSE.txt"
          cmp target/notices/THIRD-PARTY-NOTICES.txt "$app/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          lipo "$app/Contents/MacOS/torrplay-desktop" -verify_arch arm64 x86_64
          lipo "$app/Contents/MacOS/torrplay" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/torrplay" --version
          (
            test_home=$(mktemp -d "${RUNNER_TEMP}/torrplay-home.XXXXXX")
            data_dir="$test_home/Library/Application Support/org.torrplay.desktop"
            api=http://127.0.0.1:8643
            mkdir -p "$data_dir"
            printf '%s\n' 'TORRPLAY_ALLOWED_HOSTS=torrplay,*.home.arpa' \
              'TORRPLAY_LISTEN=127.0.0.1:8643' 'TORRPLAY_LOG_FORMAT=text' > "$data_dir/torrplay.env"
            env -u TORRPLAY_ALLOWED_HOSTS -u TORRPLAY_DOWNLOAD_DIR -u TORRPLAY_LISTEN -u TORRPLAY_LOG_FORMAT \
              HOME="$test_home" NO_COLOR=1 \
              "$app/Contents/MacOS/torrplay-desktop" --no-dht > "$test_home/startup.log" 2>&1 &
            pid=$!
            trap 'kill -KILL "$pid" 2>/dev/null || true; wait "$pid" || true; cat "$test_home/startup.log"' EXIT
            deadline=$((SECONDS + 60))
            until curl -fs -o /dev/null --max-time 2 "$api/readyz"; do
              kill -0 "$pid" && (( SECONDS < deadline )) || exit 1
              sleep 0.5
            done
            for host in torrplay nas.home.arpa; do
              curl -fsS -o /dev/null --max-time 2 -H "Host: $host" "$api/api/v1"
            done
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 \
              -H 'Host: other.example' "$api/api/v1")
            if [[ "$code" != 421 ]]; then
              echo "The unlisted host received $code instead of 421" >&2
              exit 1
            fi
            kill -TERM "$pid"
            deadline=$((SECONDS + 45))
            while kill -0 "$pid" 2>/dev/null; do
              (( SECONDS < deadline )) || exit 1
              sleep 0.5
            done
            wait "$pid"
            trap - EXIT
            if ! grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T.*API is listening' "$test_home/startup.log"; then
              echo 'The startup log did not contain a text-format API listener record' >&2
              cat "$test_home/startup.log" >&2
              exit 1
            fi
            [[ -f "$data_dir/torrplay.db" && -d "$data_dir/logs" ]]
            HOME="$test_home" "$app/Contents/MacOS/torrplay" backup create --output "$test_home/backup.zip"
            [[ -s "$test_home/backup.zip" ]]
          )
          hdiutil detach "$mount"
          trap - EXIT
      - name: Upload the tested disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-macos-universal
          path: target/dmg/TorrPlay.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Capture the mounted disk image in Finder
        id: capture-finder
        run: |
          scratch=$(mktemp -d "${RUNNER_TEMP}/torrplay-finder.XXXXXX")
          mount="$scratch/TorrPlay"
          mkdir "$mount"
          hdiutil attach -readonly -noautoopen -mountpoint "$mount" target/dmg/TorrPlay.dmg <<< Y
          trap 'hdiutil detach "$mount"' EXIT
          cat > "$scratch/window.swift" <<'SWIFT'
          import CoreGraphics

          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID)
              as? [[String: Any]] ?? []
          for window in windows {
              guard window[kCGWindowOwnerName as String] as? String == "Finder",
                    window[kCGWindowName as String] as? String == "TorrPlay",
                    window[kCGWindowLayer as String] as? Int == 0,
                    let id = window[kCGWindowNumber as String] as? Int else { continue }
              print(id)
              break
          }
          SWIFT
          swiftc "$scratch/window.swift" -o "$scratch/window"
          open "$mount"
          window=""
          for _ in {1..20}; do
            window=$("$scratch/window")
            if [[ -n "$window" ]]; then
              break
            fi
            sleep 1
          done
          [[ -n "$window" ]] || { echo "::error::Finder did not expose the mounted TorrPlay window"; exit 1; }
          sleep 15
          screencapture -x -o -l "$window" target/dmg/TorrPlay-Finder.png
          test -s target/dmg/TorrPlay-Finder.png
          defaults write -g AppleShowScrollBars -string Always
          /usr/bin/osascript <<'APPLESCRIPT'
          tell application "System Events"
              set dark mode of appearance preferences to true
              tell process "Finder"
                  set frontmost to true
                  tell menu "View" of menu bar 1
                      if exists menu item "Show Path Bar" then click menu item "Show Path Bar"
                      if exists menu item "Show Status Bar" then click menu item "Show Status Bar"
                      if not (exists menu item "Hide Path Bar") then error "Path bar is not visible"
                      if not (exists menu item "Hide Status Bar") then error "Status bar is not visible"
                  end tell
              end tell
          end tell
          APPLESCRIPT
          sleep 5
          screencapture -x -o -l "$window" target/dmg/TorrPlay-Finder-With-Bars.png
          test -s target/dmg/TorrPlay-Finder-With-Bars.png
      - name: Upload the Finder screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torrplay-dmg-finder
          path: target/dmg/TorrPlay-Finder*.png
          if-no-files-found: error
          retention-days: 7
