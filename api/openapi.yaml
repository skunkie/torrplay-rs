  /api/v1/cache/statistics:
    get:
      operationId: getCacheStatistics
      summary: Read piece cache statistics
      description: Returns the global piece cache's capacity and usage.
      tags: [Statistics]
      responses:
        '200':
          description: The current piece cache measurements.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatistics'
              examples:
                in_use:
                  summary: A partly used cache
                  value:
                    capacity_bytes: 268435456
                    usage_bytes: 201326592
                    pinned_bytes: 33554432
                    eviction_count: 140
                    links:
                      self: /api/v1/cache/statistics
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Read the settings
      description: >-
        Returns the application's settings: each value as set, or its default
        while it is unset.
      tags: [Settings]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The settings.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                defaults:
                  summary: Settings at their defaults
                  value:
                    piece_wait_seconds: 60
                    idle_timeout_seconds: 30
                    idle_readers_per_torrent: 4
                    idle_readers_total: 16
                    drain_period_seconds: 10
                    peer_limit: 50
                    cache_capacity_bytes: 268435456
                    background_downloads: true
                    links:
                      self: /api/v1/settings
        '304':
          $ref: '#/components/responses/NotModified'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSettings
      summary: Change the settings
      description: >-
        Applies a JSON merge patch to the settings. The request must carry
        If-Match with the settings' current ETag. A member set to null
        returns to its default, which later releases may change; one omitted
        keeps its value. The whole patch is validated before anything
        changes, and the change is stored before this returns and survives
        restarts. A change the engine refuses, or one that cannot be stored,
        leaves every setting as it was. Each setting's description says when
        a change takes effect.
      tags: [Settings]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: >-
          The settings to change, in a body of at most 16384 bytes. Larger
          bodies are content-too-large, and a body that does not arrive within
          30 seconds is request-timeout.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
            examples:
              longer_wait:
                summary: Wait longer for pieces, and reset the peer limit
                value:
                  piece_wait_seconds: 120
                  peer_limit: null
      responses:
        '200':
          description: The updated settings.
          headers:
            ETag:
              $ref: '#/components/headers/SettingsETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
              examples:
                longer_wait:
                  summary: Settings with a longer piece wait
                  value:
                    piece_wait_seconds: 120
                    idle_timeout_seconds: 30
                    idle_readers_per_torrent: 4
                    idle_readers_total: 16
                    drain_period_seconds: 10
                    peer_limit: 50
                    cache_capacity_bytes: 268435456
                    background_downloads: true
                    links:
                      self: /api/v1/settings
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '412':
          $ref: '#/components/responses/SettingsPreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /livez:
    get:
      operationId: getLiveness
      summary: Check liveness
      description: Reports whether the process is running and serving requests.
      tags: [Health]
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'

  /readyz:
    get:
      operationId: getReadiness
      summary: Check readiness
      description: >-
        Reports whether the application can serve API requests. It reports
        unavailable while the engine is starting, while stored torrents are
        restored after a start, and while the application shuts down.
      tags: [Health]
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'

components:
  parameters:
    TorrentId:
      name: torrent_id
      in: path
      required: true
      description: The torrent's ID.
      schema:
        type: string
      example: trr_7ndq4m2kzb6hxw3rjpt5yc4ula
    FileId:
      name: file_id
      in: path
      required: true
      description: The file's ID within its torrent.
      schema:
        type: string
      example: fil_xfuperelxpqq4qhvgmtq62qwv4
    PreloadId:
      name: preload_id
      in: path
      required: true
      description: The preload's ID.
      schema:
        type: string
      example: prl_4qhvgmtq62qwv4xfuperelxpq
    PageSize:
      name: page_size
      in: query
      description: The maximum number of items in a page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      description: >-
        An opaque position from a next link. It is valid only with the filters
        it was issued for.
      schema:
        type: string
      example: eyJhZnRlciI6InRycl83bmRxNG0ya3piNmh4dzNyanB0NXljNHVsYSJ9
    ObservedStateFilter:
      name: observed_state
      in: query
      description: >-
        Limits the page to torrents in any of the given observed states. Repeat
        it to match several.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ObservedState'
      example: [downloading, paused]
    CategoryFilter:
      name: category
      in: query
      description: >-
        Limits the page to torrents with any of the given categories, or,
        with uncategorized, without any.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Category'
      example: [Movies, Kids]
    UncategorizedFilter:
      name: uncategorized
      in: query
      description: >-
        Limits the page to torrents without categories, or, with category,
        also to those with any of its values.
      schema:
        type: boolean
        const: true
      example: true
    GenreFilter:
      name: genre
      in: query
      description: Limits the page to torrents with any of the given genres.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Genre'
      example: [Comedy]
    KindFilter:
      name: kind
      in: query
      description: >-
        Limits the page to torrents of any of the given kinds: the
        configured kind, or the inferred one. A torrent whose kind is not
        known yet matches none.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TorrentKind'
      example: [series]
    InfoHashFilter:
      name: info_hash
      in: query
      description: >-
        Limits the page to torrents with any of the given v1 info hashes, in
        hexadecimal of either case.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^[0-9a-fA-F]{40}$'
      example: [0123456789abcdef0123456789abcdef01234567]
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        The configuration's current strong ETag. A request without it receives
        428; a stale value receives 412.
      schema:
        type: string
      example: '"cfg-3"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag the client holds; a match receives 304.
      schema:
        type: string
      example: '"st-17"'
    Range:
      name: Range
      in: header
      description: A single byte range, including open-ended and suffix ranges.
      schema:
        type: string
      example: bytes=1048576-
    IfRange:
      name: If-Range
      in: header
      description: >-
        The content ETag the range applies to; a mismatch returns the whole
        file.
      schema:
        type: string
      example: '"sha1-0123456789abcdef0123456789abcdef01234567-0"'

  headers:
    Location:
      description: The created resource's URI.
      required: true
      schema:
        type: string
        format: uri-reference
      example: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
    StateETag:
      description: A validator that changes whenever the torrent's representation changes.
      required: true
      schema:
        type: string
      example: '"st-17"'
    ConfigurationETag:
      description: A strong validator that changes only when the configuration changes.
      required: true
      schema:
        type: string
      example: '"cfg-3"'
    SettingsETag:
      description: A strong validator that changes only when a setting changes.
      required: true
      schema:
        type: string
      example: '"set-2"'
    PosterETag:
      description: A strong validator that identifies the poster's bytes.
      required: true
      schema:
        type: string
      example: '"pst-5f1c0a9e2b7d4c3a8e6f1b2d"'
    ContentETag:
      description: A strong validator that identifies the file's bytes.
      required: true
      schema:
        type: string
      example: '"sha1-0123456789abcdef0123456789abcdef01234567-0"'
    CacheControl:
      description: Requires caches to revalidate the representation before reuse.
      required: true
      schema:
        type: string
        const: no-cache
      example: no-cache
    AcceptRanges:
      description: Advertises byte-range support.
      required: true
      schema:
        type: string
        const: bytes
      example: bytes
    ContentLength:
      description: The number of bytes in the body.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1073740800
    ContentRange:
      description: The byte range in the body and the file's total length.
      required: true
      schema:
        type: string
      example: bytes 1048576-1073740799/1073740800
    ContentDisposition:
      description: >-
        Inline for audio, video, raster image, and WebVTT files and attachment
        for every other file, with the file name encoded as RFC 6266 specifies.
      required: true
      schema:
        type: string
      example: inline; filename="part-1.mkv"
    ContentTypeOptions:
      description: Stops browsers from guessing a different media type.
      required: true
      schema:
        type: string
        const: nosniff
      example: nosniff
    ContentSecurityPolicy:
      description: Sandboxes the content if a browser opens it as a document.
      required: true
      schema:
        type: string
        const: sandbox
      example: sandbox
    MatchedETag:
      description: The current validator, which the client's If-None-Match matched.
      required: true
      schema:
        type: string
      example: '"st-17"'
    RetryAfter:
      description: The number of seconds after which a retry may succeed.
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 5
    UnsatisfiedRange:
      description: The file's total length, for a range that cannot be satisfied.
      required: true
      schema:
        type: string
      example: bytes */1073740800

  responses:
    NotModified:
      description: The representation matches the ETag the client holds.
      headers:
        ETag:
          $ref: '#/components/headers/MatchedETag'
    Healthy:
      description: The check passes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          examples:
            ok:
              summary: A passing check
              value:
                status: ok
    Unhealthy:
      description: The check fails.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            starting:
              summary: The engine is starting
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/engine-unavailable
                title: Engine unavailable
                status: 503
                detail: The torrent engine is starting.
    MalformedRequest:
      description: The request cannot be parsed or has an invalid parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            page_size:
              summary: A page size out of bounds
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/malformed-request
                title: Malformed request
                status: 400
                detail: A parameter is invalid.
                errors:
                  - detail: Must be between 1 and 200.
                    parameter: page_size
    NotFound:
      description: The target resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            torrent:
              summary: A missing torrent
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/not-found
                title: Not found
                status: 404
                detail: No torrent has the ID trr_wjrvmrmv2x4p77h4gzl5twylli.
    RequestTimeout:
      description: >-
        The request body did not arrive in time. The server closes the
        connection after this response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            slow_body:
              summary: A body that stopped arriving
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/request-timeout
                title: Request timeout
                status: 408
                detail: The request body did not arrive within 30 seconds.
    LifecycleConflict:
      description: The resource's current state does not allow the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            metadata:
              summary: Metadata is not available yet
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/lifecycle-conflict
                title: Lifecycle conflict
                status: 409
                detail: The torrent's metadata is still being retrieved.
            paused:
              summary: Content of a paused torrent
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/lifecycle-conflict
                title: Lifecycle conflict
                status: 409
                detail: The torrent is paused; start it to stream its files.
            unrestored:
              summary: A stored torrent the engine refused at startup
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/lifecycle-conflict
                title: Lifecycle conflict
                status: 409
                detail: >-
                  The torrent could not be restored: Must be a valid torrent
                  file. Delete it.
            transition:
              summary: A storage mode change during a transition
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/lifecycle-conflict
                title: Lifecycle conflict
                status: 409
                detail: The torrent's storage mode transition is in progress.
    DuplicateTorrent:
      description: A torrent with the same info hash already exists.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DuplicateTorrentProblem'
          examples:
            duplicate:
              summary: The torrent already exists
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/duplicate-torrent
                title: Duplicate torrent
                status: 409
                detail: A torrent with this info hash already exists.
                torrent: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
    PreloadConflict:
      description: >-
        The torrent's state does not allow a preload, or the file or the
        application has the most active preloads it allows.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            paused:
              summary: A preload of a paused torrent's file
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/lifecycle-conflict
                title: Lifecycle conflict
                status: 409
                detail: The torrent is not started; start it to stream its files.
            too_many:
              summary: A fifth active preload of one file
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/too-many-preloads
                title: Too many preloads
                status: 409
                detail: >-
                  A file may have 4 active preloads, and all files 16; cancel
                  one or let it end.
    PreconditionFailed:
      description: If-Match does not match the configuration's current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              summary: A stale ETag
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/precondition-failed
                title: Precondition failed
                status: 412
                detail: The configuration changed since the ETag was issued.
    SettingsPreconditionFailed:
      description: If-Match does not match the settings' current ETag.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            stale:
              summary: A stale ETag
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/precondition-failed
                title: Precondition failed
                status: 412
                detail: The settings changed since the ETag was issued.
    ContentTooLarge:
      description: The request body exceeds its documented limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            torrent_file:
              summary: An oversized torrent file
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/content-too-large
                title: Content too large
                status: 413
                detail: The request body exceeds 10485760 bytes.
    UnsupportedMediaType:
      description: The request's Content-Type is not accepted by the operation.
      headers:
        Accept:
          description: The request media types the operation accepts.
          schema:
            type: string
          example: application/json, multipart/form-data
        Accept-Patch:
          description: The patch media types a PATCH operation accepts.
          schema:
            type: string
          example: application/merge-patch+json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            media_type:
              summary: An unsupported media type
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/unsupported-media-type
                title: Unsupported media type
                status: 415
                detail: The operation does not accept text/plain.
    RangeNotSatisfiable:
      description: No requested range overlaps the content.
      headers:
        Content-Range:
          $ref: '#/components/headers/UnsatisfiedRange'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            past_end:
              summary: A range past the end of the file
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/range-not-satisfiable
                title: Range not satisfiable
                status: 416
                detail: The range starts after the end of the file.
    ValidationFailed:
      description: The body parses but violates its schema or a documented rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            desired_state:
              summary: An unknown desired state
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/validation-failed
                title: Validation failed
                status: 422
                detail: The body is invalid.
                errors:
                  - detail: Must be started or paused.
                    pointer: /desired_state
    UnprocessableTorrent:
      description: >-
        The torrent input is invalid, or it is a valid torrent the engine
        cannot handle: a v2-only torrent, one in memory storage whose piece
        length exceeds cache capacity, or one in disk storage whose files the
        download directory cannot hold.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            invalid_metainfo:
              summary: An uploaded file that is not torrent metainfo
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/validation-failed
                title: Validation failed
                status: 422
                detail: The body is invalid.
                errors:
                  - detail: Not valid torrent metainfo.
                    pointer: /torrent_file
            v2_only:
              summary: A v2-only torrent
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/unsupported-torrent
                title: Unsupported torrent
                status: 422
                detail: Only BitTorrent v1 and hybrid torrents are supported.
            piece_too_large:
              summary: A torrent whose pieces are longer than the cache
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/unsupported-torrent
                title: Unsupported torrent
                status: 422
                detail: The torrent's 16777216-byte pieces exceed the 8388608-byte cache capacity.
    UnprocessableConfiguration:
      description: >-
        The configuration patch is invalid, or it asks for a storage mode the
        torrent cannot use: disk storage for files the download directory
        cannot hold, or memory storage for pieces longer than cache capacity.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            invalid:
              summary: An unknown desired state
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/validation-failed
                title: Validation failed
                status: 422
                detail: The body is invalid.
                errors:
                  - detail: Must be started or paused.
                    pointer: /desired_state
            colliding_files:
              summary: Files that differ only in case
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/unsupported-torrent
                title: Unsupported torrent
                status: 422
                detail: >-
                  Disk storage cannot hold the files Example/a.mkv and
                  Example/A.mkv, which differ only in case.
    UnprocessablePoster:
      description: >-
        The body does not begin with the signature of the image type its
        Content-Type names.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          examples:
            not_an_image:
              summary: Bytes that are not a PNG image, sent as image/png
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/validation-failed
                title: Validation failed
                status: 422
                detail: The body is invalid.
                errors:
                  - detail: Is not an image/png image.
                    pointer: ''
    InsufficientStorage:
      description: >-
        The download directory's filesystem has less free space than the
        torrent's files need. Nothing changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            full:
              summary: Too little free space
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/insufficient-storage
                title: Insufficient storage
                status: 507
                detail: >-
                  The torrent's files need 1073740800 bytes, and the download
                  directory has 52428800 free.
    PreconditionRequired:
      description: The PATCH request omits If-Match.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing_if_match:
              summary: A PATCH without If-Match
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/precondition-required
                title: Precondition required
                status: 428
                detail: Send If-Match with the configuration's current ETag.
    InternalError:
      description: An unexpected failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              summary: An unexpected failure
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/internal-error
                title: Internal error
                status: 500
                detail: The request failed unexpectedly.
    EngineUnavailable:
      description: >-
        The torrent engine cannot serve the request right now, or, after a
        start, the stored torrents are still being restored.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            shutting_down:
              summary: The engine is shutting down
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/engine-unavailable
                title: Engine unavailable
                status: 503
                detail: The torrent engine is shutting down.
            restoring:
              summary: The stored torrents are being restored
              value:
                type: tag:skunkie.github.io,2026:torrplay/problems/engine-unavailable
                title: Engine unavailable
                status: 503
                detail: The stored torrents are being restored.

  schemas:
    EntryPoint:
      type: object
      description: The API's entry point.
      required: [links]
      properties:
        links:
          type: object
          description: Links to the top-level resources and the OpenAPI document.
          required: [self, torrents, cache_statistics, settings, service-desc]
          properties:
            self:
              type: string
              format: uri-reference
              description: The entry point.
              examples: [/api/v1]
            torrents:
              type: string
              format: uri-reference
              description: The torrents collection.
              examples: [/api/v1/torrents]
            cache_statistics:
              type: string
              format: uri-reference
              description: The piece cache's statistics.
              examples: [/api/v1/cache/statistics]
            settings:
              type: string
              format: uri-reference
              description: The application's settings.
              examples: [/api/v1/settings]
            service-desc:
              type: string
              format: uri-reference
              description: The OpenAPI document, under its RFC 8631 relation name.
              examples: [/api/v1/openapi.yaml]

    DesiredState:
      type: string
      description: The state the client wants a torrent in.
      enum: [started, paused]
      examples: [started]

    ObservedState:
      type: string
      description: >-
        The state the engine reports for a torrent. Clients must handle values
        added later.
      enum: [retrieving_metadata, downloading, paused, failed]
      examples: [downloading]

    TorrentCreation:
      type: object
      description: The input that creates a torrent from a magnet URI.
      additionalProperties: false
      required: [magnet_uri]
      properties:
        magnet_uri:
          type: string
          description: >-
            A magnet URI with a BitTorrent v1 or hybrid info hash, at most 8192
            characters.
          maxLength: 8192
          examples: ['magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567']
        desired_state:
          $ref: '#/components/schemas/CreationDesiredState'
        storage_mode:
          $ref: '#/components/schemas/CreationStorageMode'
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/ConfiguredKind'
        year:
          $ref: '#/components/schemas/Year'
        description:
          $ref: '#/components/schemas/Description'
        categories:
          $ref: '#/components/schemas/Categories'
        genres:
          $ref: '#/components/schemas/Genres'

    TorrentFileUpload:
      type: object
      description: >-
        The multipart form that creates a torrent from a torrent file. Each
        member is one part, except categories and genres, which take one part
        per value; year is a decimal integer.
      additionalProperties: false
      required: [torrent_file]
      properties:
        torrent_file:
          type: string
          contentMediaType: application/x-bittorrent
          description: The torrent file, at most 10485760 bytes.
          examples: ['d8:announce20:http://tracker.test/4:infod6:lengthi1024e4:name8:file.bin12:piece lengthi16384e6:pieces20:aaaaaaaaaaaaaaaaaaaaee']
        desired_state:
          $ref: '#/components/schemas/CreationDesiredState'
        storage_mode:
          $ref: '#/components/schemas/CreationStorageMode'
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/ConfiguredKind'
        year:
          $ref: '#/components/schemas/Year'
        description:
          $ref: '#/components/schemas/Description'
        categories:
          $ref: '#/components/schemas/Categories'
        genres:
          $ref: '#/components/schemas/Genres'

    CreationDesiredState:
      type: string
      description: The state a new torrent starts in. It defaults to started.
      enum: [started, paused]
      default: started
      examples: [paused]

    CreationStorageMode:
      type: string
      description: >-
        The storage mode a new torrent uses. It defaults to memory. A torrent
        file created in disk storage is checked as a change to disk storage
        is; a magnet URI is checked once its metadata arrives.
      enum: [memory, disk]
      default: memory
      examples: [disk]

    Title:
      type: [string, 'null']
      description: >-
        The title clients show instead of the metadata's name, or null to
        show the name. Normalized on write, as docs/lifecycle.md describes, to
        1 to 1024 characters without control characters. It defaults to
        null.
      minLength: 1
      maxLength: 1024
      default: null
      examples: [Example Film]

    TorrentKind:
      type: string
      description: What a torrent holds. Clients must handle values added later.
      enum: [movie, series, other]
      examples: [series]

    ConfiguredKind:
      anyOf:
        - $ref: '#/components/schemas/TorrentKind'
        - type: 'null'
      description: >-
        What the torrent holds, or null to infer it from the file names, as
        the torrent resource's kind describes. It defaults to null.
      default: null
      examples: [movie]

    Year:
      type: [integer, 'null']
      format: int32
      description: The release year, or null if unknown. It defaults to null.
      minimum: 1800
      maximum: 2200
      default: null
      examples: [2026]

    Description:
      type: [string, 'null']
      description: >-
        A plain-text synopsis, or null. Normalized on write to 1 to 4096
        characters, keeping line feeds and tabs and no other control
        characters. It defaults to null.
      minLength: 1
      maxLength: 4096
      default: null
      examples: [A short invented film for the examples.]

    Category:
      type: string
      description: >-
        A category: the user's own grouping of torrents, such as a menu
        entry. Normalized on write to 1 to 128 characters without control
        characters, and compared exactly; a slash is an ordinary character.
      minLength: 1
      maxLength: 128
      examples: [Movies]

    Categories:
      type: array
      description: >-
        The torrent's categories, distinct after normalization and in the
        order given; clients may treat the first as the primary one. It
        defaults to an empty list.
      maxItems: 16
      uniqueItems: true
      default: []
      items:
        $ref: '#/components/schemas/Category'
      examples: [[Movies, Kids]]

    Genre:
      type: string
      description: >-
        A genre that describes the content. Normalized and compared as a
        category is.
      minLength: 1
      maxLength: 128
      examples: [Comedy]

    Genres:
      type: array
      description: >-
        The torrent's genres, distinct after normalization and in the order
        given. It defaults to an empty list.
      maxItems: 16
      uniqueItems: true
      default: []
      items:
        $ref: '#/components/schemas/Genre'
      examples: [[Animation, Comedy]]

    PosterMediaType:
      type: string
      description: >-
        The media type of a poster image. Clients must handle values added
        later.
      enum: [image/avif, image/gif, image/jpeg, image/png, image/webp]
      examples: [image/jpeg]

    StorageMode:
      type: string
      description: >-
        Where a torrent keeps piece data. In memory storage it holds pieces in
        the global piece cache, which evicts them, downloads the pieces its
        readers need, and never uploads, because evicted pieces cannot be
        served. In disk storage it keeps verified pieces in files below the
        download directory and uploads them, and deleting the torrent deletes
        the files. Clients must handle values added later.
      enum: [memory, disk]
      examples: [memory]

    Torrent:
      type: object
      description: >-
        A torrent the application tracks. Its storage_mode is the storage mode
        in effect, which changes when a transition to the configuration's
        storage_mode completes.
      required:
        - id
        - name
        - info_hashes
        - observed_state
        - storage_mode
        - size_bytes
        - file_count
        - created_at
        - failure
        - storage_transition
        - storage_failure
        - title
        - kind
        - year
        - description
        - categories
        - genres
        - poster
        - links
      properties:
        id:
          type: string
          readOnly: true
          description: The torrent's opaque, stable ID.
          examples: [trr_7ndq4m2kzb6hxw3rjpt5yc4ula]
        name:
          type: [string, 'null']
          readOnly: true
          description: The name from the metadata, or null until metadata is available.
          examples: [Example Collection]
        info_hashes:
          type: array
          readOnly: true
          description: The torrent's protocol identifiers.
          minItems: 1
          items:
            $ref: '#/components/schemas/InfoHash'
          examples:
            - - algorithm: sha1
                value: 0123456789abcdef0123456789abcdef01234567
        observed_state:
          $ref: '#/components/schemas/ObservedState'
        storage_mode:
          $ref: '#/components/schemas/StorageMode'
        size_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          readOnly: true
          description: The total size of the torrent's files, or null until metadata is available.
          examples: [1073740800]
        file_count:
          type: [integer, 'null']
          format: int64
          minimum: 0
          readOnly: true
          description: The number of files, or null until metadata is available.
          examples: [1]
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the torrent was created, in UTC.
          examples: ['2026-10-19T12:00:00Z']
        failure:
          type: [object, 'null']
          readOnly: true
          description: >-
            Why the torrent failed, or null unless its observed state is
            failed. Pausing and then starting the torrent clears it.
          required: [detail]
          properties:
            detail:
              type: string
              description: An explanation of the failure.
              examples: [A piece could not be written to storage.]
          examples: [null]
        storage_transition:
          type: [object, 'null']
          readOnly: true
          description: >-
            The storage mode transition in progress, or null when there is
            none.
          required: [target_storage_mode]
          properties:
            target_storage_mode:
              $ref: '#/components/schemas/StorageMode'
          examples: [null]
        storage_failure:
          type: [object, 'null']
          readOnly: true
          description: >-
            Why the last storage mode transition failed, or null. It clears with
            the next change of storage mode and with a restart.
          required: [target_storage_mode, detail]
          properties:
            target_storage_mode:
              $ref: '#/components/schemas/StorageMode'
            detail:
              type: string
              description: Why the transition failed.
              examples: [The torrent's directory could not be created.]
          examples: [null]
        title:
          $ref: '#/components/schemas/Title'
        kind:
          readOnly: true
          anyOf:
            - $ref: '#/components/schemas/TorrentKind'
            - type: 'null'
          description: >-
            The configuration's kind, or, while it is null, the kind inferred
            from the file names: series if a video file's name has an episode
            pattern, movie if the torrent has another video file, and other
            otherwise. It is null while neither is known, before metadata is
            available.
          examples: [movie]
        year:
          $ref: '#/components/schemas/Year'
        description:
          $ref: '#/components/schemas/Description'
        categories:
          $ref: '#/components/schemas/Categories'
        genres:
          $ref: '#/components/schemas/Genres'
        poster:
          type: [object, 'null']
          readOnly: true
          description: The torrent's poster, or null if it has none.
          required: [media_type, size_bytes, updated_at]
          properties:
            media_type:
              $ref: '#/components/schemas/PosterMediaType'
            size_bytes:
              type: integer
              format: int64
              minimum: 1
              maximum: 1048576
              description: The image's size.
              examples: [48213]
            updated_at:
              type: string
              format: date-time
              description: When the image was uploaded, in UTC.
              examples: ['2026-10-19T12:05:00Z']
          examples: [null]
        links:
          type: object
          readOnly: true
          description: Links from a torrent to its related resources.
          required: [self, configuration, files, statistics, poster]
          properties:
            self:
              type: string
              format: uri-reference
              description: This torrent.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula]
            configuration:
              type: string
              format: uri-reference
              description: The torrent's configuration.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration]
            files:
              type: string
              format: uri-reference
              description: >-
                The torrent's files, which return lifecycle-conflict until
                metadata is available.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files]
            statistics:
              type: string
              format: uri-reference
              description: The torrent's statistics.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics]
            poster:
              type: string
              format: uri-reference
              description: >-
                The torrent's poster, which is not-found while the torrent has
                none.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/poster]

    InfoHash:
      type: object
      description: A protocol identifier of a torrent's info dictionary.
      required: [algorithm, value]
      properties:
        algorithm:
          type: string
          description: The hash algorithm. Clients must handle values added later.
          enum: [sha1]
          examples: [sha1]
        value:
          type: string
          description: The hash in lowercase hexadecimal.
          pattern: '^[0-9a-f]{40}$'
          examples: [0123456789abcdef0123456789abcdef01234567]

    TorrentPage:
      type: object
      description: A page of torrents.
      required: [items, links]
      properties:
        items:
          type: array
          description: The torrents on this page.
          items:
            $ref: '#/components/schemas/Torrent'
          examples: [[]]
        links:
          type: object
          description: Links from a page of torrents.
          required: [self]
          properties:
            self:
              type: string
              format: uri-reference
              description: This page of torrents.
              examples: [/api/v1/torrents]
            next:
              type: string
              format: uri-reference
              description: The next page of torrents, omitted on the last page.
              examples: ['/api/v1/torrents?cursor=eyJhZnRlciI6InRycl83bmRxNG0ya3piNmh4dzNyanB0NXljNHVsYSJ9']

    TorrentConfiguration:
      type: object
      description: >-
        The writable configuration of a torrent. Its storage_mode is the one
        the client asked for; while a transition runs, the torrent resource's
        storage_mode is still the previous one.
      required: [desired_state, storage_mode, title, kind, year, description, categories, genres, links]
      properties:
        desired_state:
          $ref: '#/components/schemas/DesiredState'
        storage_mode:
          $ref: '#/components/schemas/StorageMode'
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/ConfiguredKind'
        year:
          $ref: '#/components/schemas/Year'
        description:
          $ref: '#/components/schemas/Description'
        categories:
          $ref: '#/components/schemas/Categories'
        genres:
          $ref: '#/components/schemas/Genres'
        links:
          type: object
          readOnly: true
          description: Links from a configuration.
          required: [self, torrent]
          properties:
            self:
              type: string
              format: uri-reference
              description: This configuration.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration]
            torrent:
              type: string
              format: uri-reference
              description: The torrent this configuration belongs to.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula]

    TorrentConfigurationPatch:
      type: object
      description: >-
        A JSON merge patch of a torrent's configuration. Omitted members keep
        their values. A library member set to null takes its default: null,
        or an empty list for categories and genres. A list replaces the
        whole list, as RFC 7396 replaces arrays.
      additionalProperties: false
      minProperties: 1
      properties:
        desired_state:
          $ref: '#/components/schemas/DesiredState'
        storage_mode:
          $ref: '#/components/schemas/StorageMode'
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/ConfiguredKind'
        year:
          $ref: '#/components/schemas/Year'
        description:
          $ref: '#/components/schemas/Description'
        categories:
          type: [array, 'null']
          maxItems: 16
          uniqueItems: true
          description: The categories, replacing the current ones; null clears them.
          items:
            $ref: '#/components/schemas/Category'
          examples: [[Movies, Kids]]
        genres:
          type: [array, 'null']
          maxItems: 16
          uniqueItems: true
          description: The genres, replacing the current ones; null clears them.
          items:
            $ref: '#/components/schemas/Genre'
          examples: [[Animation, Comedy]]

    Settings:
      type: object
      description: >-
        The application's settings. Each value is the one set, or its default
        while it is unset.
      required: [piece_wait_seconds, idle_timeout_seconds, idle_readers_per_torrent, idle_readers_total, drain_period_seconds, peer_limit, cache_capacity_bytes, background_downloads, links]
      properties:
        piece_wait_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 600
          default: 60
          description: >-
            How long a stream waits for a missing piece before it is canceled,
            and how long a peer may hold requests without delivering before it
            is disconnected. Applies to waits that begin after the change.
          examples: [60]
        idle_timeout_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 3600
          default: 30
          description: >-
            How long a reader stays idle after its stream ends, for the
            player's next range request to continue it; 0 releases it at once.
            Applies at once: idle readers idle for longer are released.
          examples: [30]
        idle_readers_per_torrent:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
          default: 4
          description: >-
            The most idle readers one torrent keeps; at most
            idle_readers_total. Applies at once: the oldest idle readers over
            the limit are released.
          examples: [4]
        idle_readers_total:
          type: integer
          format: int32
          minimum: 0
          maximum: 256
          default: 16
          description: >-
            The most idle readers all torrents keep together. Applies at once:
            the oldest idle readers over the limit are released.
          examples: [16]
        drain_period_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 10
          description: >-
            How long streams in progress may continue after a termination
            signal before they are canceled, within the 30-second shutdown
            limit. Applies to the next shutdown.
          examples: [10]
        peer_limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 50
          description: >-
            The most peers one torrent connects to at a time, connecting ones
            included. Applies to torrents as they start: when created,
            started, or restored after a restart.
          examples: [50]
        cache_capacity_bytes:
          type: integer
          format: int64
          minimum: 4194304
          maximum: 68719476736
          default: 268435456
          description: >-
            The capacity of the global piece cache that every torrent in
            memory storage mode shares; the readahead budget is half of it. It
            must be at least the piece length of every torrent with metadata.
            Applies at once. Growing it admits the pieces waiting for room.
            Shrinking it evicts verified, unpinned pieces down to the new
            capacity, releasing idle readers when nothing else can be evicted;
            until partial pieces complete and active readers leave their
            current pieces, cache usage may stay above the capacity, and no
            new piece is admitted.
          examples: [268435456]
        background_downloads:
          type: boolean
          default: true
          description: >-
            Whether started torrents in disk storage download the pieces they
            lack while no reader exists. Applies at once: turned off, torrents
            request only the pieces readers need, and requests already sent
            finish; turned on, background downloads resume unless playback is
            active.
          examples: [true]
        links:
          type: object
          readOnly: true
          description: Links from the settings.
          required: [self]
          properties:
            self:
              type: string
              format: uri-reference
              description: These settings.
              examples: [/api/v1/settings]

    SettingsPatch:
      type: object
      description: >-
        A JSON merge patch of the settings. Omitted members keep their values;
        a member set to null returns to its default.
      additionalProperties: false
      minProperties: 1
      properties:
        piece_wait_seconds:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 600
          description: The new value, or null for the default, 60.
          examples: [60, null]
        idle_timeout_seconds:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 3600
          description: The new value, or null for the default, 30.
          examples: [30, null]
        idle_readers_per_torrent:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 64
          description: The new value, or null for the default, 4.
          examples: [4, null]
        idle_readers_total:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 256
          description: The new value, or null for the default, 16.
          examples: [16, null]
        drain_period_seconds:
          type: [integer, 'null']
          format: int32
          minimum: 0
          maximum: 25
          description: The new value, or null for the default, 10.
          examples: [10, null]
        peer_limit:
          type: [integer, 'null']
          format: int32
          minimum: 1
          maximum: 500
          description: The new value, or null for the default, 50.
          examples: [50, null]
        cache_capacity_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 4194304
          maximum: 68719476736
          description: The new value, or null for the default, 268435456.
          examples: [268435456, null]
        background_downloads:
          type: [boolean, 'null']
          description: The new value, or null for the default, true.
          examples: [false, null]

    TorrentFile:
      type: object
      description: A file listed in a torrent's metadata.
      required: [id, path, size_bytes, media_type, links]
      properties:
        id:
          type: string
          description: The file's ID, stable within its torrent.
          examples: [fil_xfuperelxpqq4qhvgmtq62qwv4]
        path:
          type: array
          description: The file's path components from the metadata, in order.
          minItems: 1
          items:
            type: string
          examples:
            - [Example Collection, part-1.mkv]
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: The file's size.
          examples: [1073740800]
        media_type:
          type: string
          description: >-
            The media type the content is served with, derived from the file
            name; application/octet-stream unless the file is audio, video, a
            raster image, or WebVTT.
          examples: [video/x-matroska]
        links:
          type: object
          description: Links from a file.
          required: [self, content, preloads, torrent]
          properties:
            self:
              type: string
              format: uri-reference
              description: This file.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4]
            content:
              type: string
              format: uri-reference
              description: The file's content.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content]
            preloads:
              type: string
              format: uri-reference
              description: The file's preloads.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads]
            torrent:
              type: string
              format: uri-reference
              description: The torrent the file belongs to.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula]

    TorrentFilePage:
      type: object
      description: A page of a torrent's files.
      required: [items, links]
      properties:
        items:
          type: array
          description: The files on this page.
          items:
            $ref: '#/components/schemas/TorrentFile'
          examples: [[]]
        links:
          type: object
          description: Links from a page of files.
          required: [self]
          properties:
            self:
              type: string
              format: uri-reference
              description: This page of files.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files]
            next:
              type: string
              format: uri-reference
              description: The next page of files, omitted on the last page.
              examples: ['/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files?cursor=eyJhZnRlciI6ImZpbF94ZnVwZXJlbHhwcXE0cWh2Z210cTYycXd2NCJ9']

    PreloadState:
      type: string
      description: >-
        Where a preload is in its lifecycle. queued waits for room in the
        preloads' share of the readahead budget, downloading fetches its
        pieces, and ready holds them all; expired and failed preloads have
        ended and released their pins and piece priorities.
      enum: [queued, downloading, ready, expired, failed]
      examples: [downloading]

    PreloadCreation:
      type: object
      description: What a new preload covers, and for how long.
      additionalProperties: false
      properties:
        offset_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Where playback resumes in the file, below its size: the preload
            covers the file's first and last pieces and a window that starts
            an eighth of its length before this offset. Omitted, it covers
            the file's head and tail.
          examples: [536870912]
        ttl_seconds:
          type: integer
          format: int32
          minimum: 10
          maximum: 3600
          default: 120
          description: How long after its creation the preload expires.
          examples: [120]

    Preload:
      type: object
      description: >-
        A preload of part of a file, as docs/lifecycle.md describes. In
        memory storage its pieces are pinned while it downloads or is ready.
      required: [id, state, offset_bytes, ranges, target_bytes, completed_bytes, created_at, expires_at, ended_at, failure, links]
      properties:
        id:
          type: string
          description: >-
            The preload's ID, valid until it is canceled or removed, or the
            application restarts.
          examples: [prl_4qhvgmtq62qwv4xfuperelxpq]
        state:
          $ref: '#/components/schemas/PreloadState'
        offset_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: The offset the preload was created with, or null for the head and tail.
          examples: [null]
        ranges:
          type: array
          description: >-
            The file's byte ranges the preload covers, in file order and
            disjoint: whole pieces, clipped to the file, at most 33554432
            bytes in all. A file that fits is covered whole.
          minItems: 1
          items:
            $ref: '#/components/schemas/PreloadRange'
          examples:
            - - start_bytes: 0
                length_bytes: 29360128
        target_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The bytes of the ranges together.
          examples: [33554432]
        completed_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The bytes of the ranges the torrent's storage holds now, at most
            target_bytes, which it reaches when the preload is ready.
          examples: [8388608]
        created_at:
          type: string
          format: date-time
          description: When the preload was created, in UTC.
          examples: ['2026-10-19T12:00:00Z']
        expires_at:
          type: string
          format: date-time
          description: When the preload expires, or expired, in UTC.
          examples: ['2026-10-19T12:02:00Z']
        ended_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the preload expired or failed, in UTC, or null while it is
            active. It is removed 5 minutes later.
          examples: [null]
        failure:
          type: [object, 'null']
          description: >-
            Why the preload failed, or null unless its state is failed: its
            torrent paused or failed, its pieces stopped arriving for the
            piece wait bound, or the piece cache needed its pins.
          required: [detail]
          properties:
            detail:
              type: string
              description: An explanation of how the preload failed.
              examples: [The torrent was paused.]
          examples: [null]
        links:
          type: object
          description: Links from a preload.
          required: [self, file, content]
          properties:
            self:
              type: string
              format: uri-reference
              description: This preload.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads/prl_4qhvgmtq62qwv4xfuperelxpq]
            file:
              type: string
              format: uri-reference
              description: The preloaded file.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4]
            content:
              type: string
              format: uri-reference
              description: The preloaded file's content.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content]

    PreloadRange:
      type: object
      description: A byte range of a file.
      required: [start_bytes, length_bytes]
      properties:
        start_bytes:
          type: integer
          format: int64
          minimum: 0
          description: The offset in the file where the range starts.
          examples: [0]
        length_bytes:
          type: integer
          format: int64
          minimum: 1
          description: The range's length.
          examples: [29360128]

    PreloadPage:
      type: object
      description: A file's preloads.
      required: [items, links]
      properties:
        items:
          type: array
          description: The preloads, in creation order.
          maxItems: 16
          items:
            $ref: '#/components/schemas/Preload'
          examples: [[]]
        links:
          type: object
          description: Links from a file's preloads.
          required: [self]
          properties:
            self:
              type: string
              format: uri-reference
              description: These preloads.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads]

    TorrentStatistics:
      type: object
      description: Transfer and peer measurements for a torrent.
      required:
        - downloaded_bytes
        - uploaded_bytes
        - download_rate_bytes_per_second
        - upload_rate_bytes_per_second
        - peer_count
        - completion_ratio
        - links
      properties:
        downloaded_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Bytes downloaded from peers since the torrent was created.
          examples: [536870912]
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Bytes uploaded to peers since the torrent was created. Always 0 in
            memory storage mode, which does not upload.
          examples: [0]
        download_rate_bytes_per_second:
          type: integer
          format: int64
          minimum: 0
          description: The current download rate.
          examples: [4194304]
        upload_rate_bytes_per_second:
          type: integer
          format: int64
          minimum: 0
          description: The current upload rate, always 0 in memory storage mode.
          examples: [0]
        peer_count:
          type: integer
          format: int64
          minimum: 0
          description: The number of connected peers.
          examples: [12]
        completion_ratio:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: >-
            The fraction of the torrent's pieces currently held, from 0.0 to
            1.0, or null until metadata is available.
          examples: [0.5]
        links:
          type: object
          description: Links from a torrent's statistics.
          required: [self, torrent]
          properties:
            self:
              type: string
              format: uri-reference
              description: These statistics.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics]
            torrent:
              type: string
              format: uri-reference
              description: The torrent these statistics measure.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula]

    CacheStatistics:
      type: object
      description: >-
        The global piece cache's capacity and usage. Cache usage is reported
        separately from process memory and does not bound it.
      required: [capacity_bytes, usage_bytes, pinned_bytes, eviction_count, links]
      properties:
        capacity_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The cache capacity in effect, as the cache_capacity_bytes setting
            sets it.
          examples: [268435456]
        usage_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The bytes counted against capacity, including pending allocations
            and retained reusable buffers. It stays within capacity_bytes,
            except after the capacity shrinks, until eviction and readers
            leaving their pieces bring it down.
          examples: [201326592]
        pinned_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The full length of each resident piece covered by at least one
            pinned range, counted once. Eviction skips these pieces.
          examples: [33554432]
        eviction_count:
          type: integer
          format: int64
          minimum: 0
          description: The number of pieces evicted since the process started.
          examples: [140]
        links:
          type: object
          description: Links from the cache statistics.
          required: [self]
          properties:
            self:
              type: string
              format: uri-reference
              description: The cache statistics.
              examples: [/api/v1/cache/statistics]

    Health:
      type: object
      description: The result of a passing health check.
      required: [status]
      properties:
        status:
          type: string
          description: Always ok for a passing check.
          enum: [ok]
          examples: [ok]

    Problem:
      type: object
      description: An RFC 9457 problem details object.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >-
            The problem type, a tag URI under
            tag:skunkie.github.io,2026:torrplay/problems/.
          examples: ['tag:skunkie.github.io,2026:torrplay/problems/not-found']
        title:
          type: string
          description: A short summary that is the same for every occurrence of the type.
          examples: [Not found]
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: The HTTP status code of the response.
          examples: [404]
        detail:
          type: string
          description: An explanation of this occurrence, omitted when there is none.
          examples: [No torrent has the ID trr_wjrvmrmv2x4p77h4gzl5twylli.]
        instance:
          type: string
          format: uri-reference
          description: An identifier of this occurrence, omitted when there is none.
          examples: [/api/v1/torrents/trr_wjrvmrmv2x4p77h4gzl5twylli]

    ValidationProblem:
      description: A problem that lists the invalid parameters or body members.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              description: >-
                The individual validation failures, omitted when the request
                cannot be parsed far enough to locate them.
              items:
                $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      description: >-
        One validation failure, located by a parameter name or by a JSON
        Pointer into the body.
      required: [detail]
      properties:
        detail:
          type: string
          description: What is wrong with the value.
          examples: [Must be between 1 and 200.]
        parameter:
          type: string
          description: The name of the invalid path or query parameter.
          examples: [page_size]
        pointer:
          type: string
          description: An RFC 6901 JSON Pointer to the invalid body member.
          examples: [/desired_state]

    DuplicateTorrentProblem:
      description: A duplicate-torrent problem that links to the existing torrent.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [torrent]
          properties:
            torrent:
              type: string
              format: uri-reference
              description: The existing torrent with the same info hash.
              examples: [/api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula]
