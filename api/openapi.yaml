      description: Removes the profile's avatar, durably.
      tags: [Profiles]
      responses:
        '204':
          description: The profile's avatar was removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
