      responses:
        '200':
          description: The profile's avatar image.
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/PosterETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
          content:
            image/avif:
              schema:
                type: string
                contentMediaType: image/avif
            image/gif:
              schema:
                type: string
                contentMediaType: image/gif
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    head:
      operationId: headProfileAvatar
      summary: Read a profile's avatar's headers
      description: Returns the headers and status a GET of the avatar would return, without a body.
      tags: [Profiles]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The profile's avatar image's headers.
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/PosterETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    put:
      operationId: putProfileAvatar
      summary: Upload a profile's avatar
      description: >-
        Stores the image as the profile's avatar, replacing any it had, under the rules
        of a torrent's poster: at most 1048576 bytes of an AVIF, GIF, JPEG,
        PNG, or WebP image whose bytes begin with the signature of the type
        its Content-Type names. The server never fetches images itself. The
        image is stored before this returns and survives restarts. The last
        of concurrent uploads wins.
      tags: [Profiles]
      requestBody:
        description: >-
          The avatar image, at most 1048576 bytes. Larger bodies are
          content-too-large, and a body that does not arrive within 30 seconds
          is request-timeout.
        required: true
        content:
          image/avif:
            schema:
              type: string
              contentMediaType: image/avif
          image/gif:
            schema:
              type: string
              contentMediaType: image/gif
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/png:
            schema:
              type: string
              contentMediaType: image/png
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
      responses:
        '201':
          description: There was no profile's avatar, and this one was stored.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/PosterETag'
        '204':
          description: The profile's avatar was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/PosterETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
