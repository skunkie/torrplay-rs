          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentStatistics'
              examples:
                downloading:
                  summary: A torrent being downloaded
                  value:
                    downloaded_bytes: 536870912
                    uploaded_bytes: 0
                    download_rate_bytes_per_second: 4194304
                    upload_rate_bytes_per_second: 0
                    peer_count: 12
                    completion_ratio: 0.5
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics
                      torrent: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
