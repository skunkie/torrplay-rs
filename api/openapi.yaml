  /api/v1/torrents/{torrent_id}/files/{file_id}/content:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: getTorrentFileContent
      summary: Stream a file's content
      description: >-
        Streams a file's bytes, whole or as a single byte range. Audio, video,
        raster image, and WebVTT files are served inline with their own media
        type; every other file is served as application/octet-stream for
        download. A Range header with more than one range is ignored. The
        request is a lifecycle-conflict while metadata is unavailable or the
        torrent is paused or failed.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/IfRange'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ContentETag'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
          content:
            video/*:
              schema:
                type: string
                contentMediaType: video/*
            audio/*:
              schema:
                type: string
                contentMediaType: audio/*
            image/*:
              schema:
                type: string
                contentMediaType: image/*
            text/vtt:
              schema:
                type: string
                contentMediaType: text/vtt
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: The requested byte range.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Range:
              $ref: '#/components/headers/ContentRange'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ContentETag'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
          content:
            video/*:
              schema:
                type: string
                contentMediaType: video/*
            audio/*:
              schema:
                type: string
                contentMediaType: audio/*
            image/*:
              schema:
                type: string
                contentMediaType: image/*
            text/vtt:
              schema:
                type: string
                contentMediaType: text/vtt
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    head:
      operationId: headTorrentFileContent
      summary: Read a file's content headers
      description: >-
        Returns the headers and status a GET would return, without a body. It
        never creates readers or prefetches piece data.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/IfRange'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The headers of the whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ContentETag'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
        '206':
          description: The headers of the requested byte range.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            Content-Range:
              $ref: '#/components/headers/ContentRange'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            ETag:
              $ref: '#/components/headers/ContentETag'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /api/v1/torrents/{torrent_id}/files/{file_id}/preloads:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
      - $ref: '#/components/parameters/FileId'
    get:
      operationId: listFilePreloads
      summary: List a file's preloads
      description: >-
        Returns the file's preloads in creation order: those queued,
        downloading, or ready, and those that expired or failed in the last 5
        minutes, at most 16 of them. The collection is never paginated.
        Preloads are not stored, so a restart empties it.
      tags: [Preloads]
      responses:
        '200':
          description: The preloads of the file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreloadPage'
              examples:
                one:
                  summary: One downloading preload
                  value:
                    items:
                    - id: prl_4qhvgmtq62qwv4xfuperelxpq
                      state: downloading
                      offset_bytes: null
                      ranges:
                        - start_bytes: 0
                          length_bytes: 29360128
                        - start_bytes: 1069546496
                          length_bytes: 4194304
                      target_bytes: 33554432
                      completed_bytes: 8388608
                      created_at: '2026-10-19T12:00:00Z'
                      expires_at: '2026-10-19T12:02:00Z'
                      ended_at: null
                      failure: null
                      links:
                        self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads/prl_4qhvgmtq62qwv4xfuperelxpq
                        file: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4
                        content: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    post:
      operationId: createFilePreload
      summary: Preload part of a file
      description: >-
        Creates a preload of the file, which fetches its head and tail, or
        with offset_bytes its first and last pieces and a window around that
        offset, before playback starts, and returns at once while it
        downloads. docs/lifecycle.md describes what a preload covers, how
        it queues, pins, and ranks against readers, and when it expires or
        fails. The torrent must be started.
      tags: [Preloads]
      requestBody:
        description: >-
          The preload's offset and time to live, in a JSON body of at most
          16384 bytes; an empty object asks for the head and tail for 120
          seconds. Larger bodies are content-too-large, and a body that does
          not arrive within 30 seconds is request-timeout.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreloadCreation'
            examples:
              head_and_tail:
                summary: The head and tail, for the default time
                value: {}
              resume:
                summary: A window where playback resumes, for 10 minutes
                value:
                  offset_bytes: 536870912
                  ttl_seconds: 600
      responses:
        '201':
          description: The preload was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preload'
              examples:
                created:
                  summary: A preload of a file's head and tail
                  value:
                    id: prl_4qhvgmtq62qwv4xfuperelxpq
                    state: queued
                    offset_bytes: null
                    ranges:
                      - start_bytes: 0
                        length_bytes: 29360128
                      - start_bytes: 1069546496
                        length_bytes: 4194304
                    target_bytes: 33554432
                    completed_bytes: 0
                    created_at: '2026-10-19T12:00:00Z'
                    expires_at: '2026-10-19T12:02:00Z'
                    ended_at: null
                    failure: null
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads/prl_4qhvgmtq62qwv4xfuperelxpq
                      file: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4
                      content: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/PreloadConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /api/v1/torrents/{torrent_id}/files/{file_id}/preloads/{preload_id}:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/PreloadId'
    get:
      operationId: getFilePreload
      summary: Read a preload
      description: >-
        Returns a preload's state and progress. An expired or failed preload
        stays readable for 5 minutes after it ended; a canceled one is gone
        at once.
      tags: [Preloads]
      responses:
        '200':
          description: The preload.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preload'
              examples:
                downloading:
                  summary: A preload that is downloading
                  value:
                    id: prl_4qhvgmtq62qwv4xfuperelxpq
                    state: downloading
                    offset_bytes: null
                    ranges:
                      - start_bytes: 0
                        length_bytes: 29360128
                      - start_bytes: 1069546496
                        length_bytes: 4194304
                    target_bytes: 33554432
                    completed_bytes: 8388608
                    created_at: '2026-10-19T12:00:00Z'
                    expires_at: '2026-10-19T12:02:00Z'
                    ended_at: null
                    failure: null
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads/prl_4qhvgmtq62qwv4xfuperelxpq
                      file: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4
                      content: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content
                failed:
                  summary: A preload whose torrent was paused
                  value:
                    id: prl_4qhvgmtq62qwv4xfuperelxpq
                    state: failed
                    offset_bytes: null
                    ranges:
                      - start_bytes: 0
                        length_bytes: 29360128
                      - start_bytes: 1069546496
                        length_bytes: 4194304
                    target_bytes: 33554432
                    completed_bytes: 8388608
                    created_at: '2026-10-19T12:00:00Z'
                    expires_at: '2026-10-19T12:02:00Z'
                    ended_at: '2026-10-19T12:00:30Z'
                    failure:
                      detail: The torrent was paused.
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/preloads/prl_4qhvgmtq62qwv4xfuperelxpq
                      file: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4
                      content: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files/fil_xfuperelxpqq4qhvgmtq62qwv4/content
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    delete:
      operationId: deleteFilePreload
      summary: Cancel a preload
      description: >-
        Cancels a preload, whatever its state, and removes it: its pins and
        piece priorities are released at once, and the pieces it fetched
        become ordinary eviction candidates.
      tags: [Preloads]
      responses:
        '204':
          description: The preload was canceled.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /api/v1/torrents/{torrent_id}/statistics:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
    get:
      operationId: getTorrentStatistics
      summary: Read a torrent's statistics
      description: Returns transfer and peer measurements for a torrent.
      tags: [Statistics]
      responses:
