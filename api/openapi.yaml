openapi: 3.2.1
info:
  title: TorrPlay API
  summary: Torrent streaming backend.
  description: >-
    The native REST API of the TorrPlay Rust prototype. It manages torrents,
    lists their files, and streams file content with byte ranges.
    docs/api-conventions.md defines the naming, linking, pagination, and error
    conventions every operation follows, including the 401, 403, 405, 406,
    and 421 responses any operation may return. Authentication is off until
    a password is set; then every operation needs an access token unless
    its security requirements include the empty one, and docs/lifecycle.md
    describes access tokens, playback tokens, and the allowed hosts.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:{port}
    description: The application on its default loopback address.
    variables:
      port:
        default: '8080'
        description: The configured listen port.
security:
  - {}
  - accessToken: []
tags:
  - name: Service
    description: The entry point and the OpenAPI document.
  - name: Torrents
    description: Torrents the application tracks, with their configuration.
  - name: Posters
    description: Images uploaded to show torrents in a library.
  - name: Files
    description: Files listed in torrent metadata and their content.
  - name: Profiles
    description: People's viewing identities, each with its own progress.
  - name: Progress
    description: Where a profile is in each file, and what is up next.
  - name: Preloads
    description: Parts of files fetched before playback starts.
  - name: Settings
    description: The application's settings, which tune streaming and shutdown.
  - name: Authentication
    description: The password, access tokens, and playback tokens.
  - name: Statistics
    description: Measurements of torrents and of the piece cache.
  - name: Health
    description: Liveness and readiness checks outside the versioned API.

paths:
  /api/v1:
    get:
      operationId: getEntryPoint
      summary: Read the entry point
      description: >-
        Returns links to the top-level resources and to the OpenAPI document.
        A request for /api/v1/ is redirected here with 308 Permanent Redirect.
      tags: [Service]
      security:
        - {}
      responses:
        '200':
          description: The entry point's links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPoint'
              examples:
                entry_point:
                  summary: The entry point
                  value:
                    links:
                      self: /api/v1
                      torrents: /api/v1/torrents
                      profiles: /api/v1/profiles
                      cache_statistics: /api/v1/cache/statistics
                      settings: /api/v1/settings
                      password: /api/v1/password
                      access_tokens: /api/v1/access-tokens
                      playback_tokens: /api/v1/playback-tokens
                      service-desc: /api/v1/openapi.yaml
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      summary: Read the OpenAPI document
      description: Returns this OpenAPI document.
      tags: [Service]
      security:
        - {}
      responses:
        '200':
          description: The OpenAPI document as YAML.
          content:
            application/yaml:
              schema:
                type: string
              examples:
                document:
                  summary: The start of the document
                  value: "openapi: 3.2.1\n"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/torrents:
    get:
      operationId: listTorrents
      summary: List torrents
      description: >-
        Returns a page of torrents, newest first by creation time, with the
        torrent ID as the tie-breaker. Each filter parameter may repeat, and a
        torrent matches it if it matches any of its values; a torrent must
        match every filter parameter the request gives. Category and genre
        values are normalized as the configuration's are, then compared
        exactly. With search, only matching torrents are listed, best
        matches first, as docs/lifecycle.md describes; equal matches keep
        the newest-first order. The response's facets describe the torrents
        before the search and the category, uncategorized, and genre
        filters, so a client can show its menus and counts from any page.
        The ETag derives from the facets' version and the request, and a
        matching If-None-Match receives 304.
      tags: [Torrents]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Fuzzy'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/ObservedStateFilter'
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/UncategorizedFilter'
        - $ref: '#/components/parameters/GenreFilter'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/InfoHashFilter'
      responses:
        '200':
          description: The requested page of torrents.
          headers:
            ETag:
              $ref: '#/components/headers/ListingETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentPage'
              examples:
                last_page:
                  summary: A single, last page
                  value:
                    items:
                      - id: trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                        name: Example Collection
                        info_hashes:
                          - algorithm: sha1
                            value: 0123456789abcdef0123456789abcdef01234567
                        observed_state: downloading
                        storage_mode: memory
                        size_bytes: 1073740800
                        file_count: 1
                        created_at: '2026-10-19T12:00:00Z'
                        failure: null
                        storage_transition: null
                        storage_failure: null
                        title: Example Film
                        kind: movie
                        year: 2026
                        description: A short invented film for the examples.
                        categories: [Movies, Kids]
                        genres: [Animation, Comedy]
                        poster:
                          media_type: image/jpeg
                          size_bytes: 48213
                          updated_at: '2026-10-19T12:05:00Z'
                        links:
                          self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                          configuration: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration
                          files: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files
                          statistics: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics
                          poster: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/poster
                    total: 1
                    facets:
                      total: 1
                      uncategorized: 0
                      categories:
                        - name: Kids
                          count: 1
                        - name: Movies
                          count: 1
                      genres:
                        - name: Animation
                          count: 1
                        - name: Comedy
                          count: 1
                      version: lv-4f2a9c1e7b3d5a8f0c6e2b1d
                    links:
                      self: /api/v1/torrents
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    post:
      operationId: createTorrent
      summary: Create a torrent
      description: >-
        Creates a torrent from a magnet URI in JSON or from an uploaded torrent
        file in a multipart form. The torrent exists as soon as this returns,
        stored so that it survives restarts with its ID; metadata for a magnet
        URI is retrieved in the background. Retrying is safe: a client whose
        request timed out receives either 201 or a duplicate-torrent problem
        that links to the torrent its first attempt created. A torrent created
        in disk storage keeps its files in the download directory, as
        docs/adr/0009-disk-storage.md describes. The request may also set
        the configuration's library members; a poster is uploaded to the
        torrent's poster afterward.
      tags: [Torrents]
      requestBody:
        description: >-
          A magnet URI in a JSON body of at most 16384 bytes, or a torrent file
          of at most 10485760 bytes in a multipart form. Larger bodies are
          content-too-large, and a body that does not arrive within 30
          seconds is request-timeout.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TorrentCreation'
            examples:
              magnet:
                summary: A magnet URI
                value:
                  magnet_uri: 'magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567&dn=Example+Collection'
              organized:
                summary: A magnet URI with a title and categories
                value:
                  magnet_uri: 'magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567&dn=Example+Collection'
                  title: Example Film
                  kind: movie
                  categories: [Movies]
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TorrentFileUpload'
            encoding:
              torrent_file:
                contentType: application/x-bittorrent
            examples:
              upload:
                summary: An uploaded torrent file
                value:
                  torrent_file: d8:announce20:http://tracker.test/4:infod6:lengthi1024e4:name8:file.bin12:piece lengthi16384e6:pieces20:aaaaaaaaaaaaaaaaaaaaee
                  desired_state: paused
      responses:
        '201':
          description: The torrent was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Torrent'
              examples:
                retrieving:
                  summary: A torrent whose metadata is being retrieved
                  value:
                    id: trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                    name: null
                    info_hashes:
                      - algorithm: sha1
                        value: 0123456789abcdef0123456789abcdef01234567
                    observed_state: retrieving_metadata
                    storage_mode: memory
                    size_bytes: null
                    file_count: null
                    created_at: '2026-10-19T12:00:00Z'
                    failure: null
                    storage_transition: null
                    storage_failure: null
                    title: null
                    kind: null
                    year: null
                    description: null
                    categories: []
                    genres: []
                    poster: null
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                      configuration: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration
                      files: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files
                      statistics: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics
                      poster: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/poster
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/DuplicateTorrent'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableTorrent'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /api/v1/torrents/{torrent_id}:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
    get:
      operationId: getTorrent
      summary: Read a torrent
      description: >-
        Returns a torrent's metadata and observed state. docs/lifecycle.md
        defines how the observed state follows from metadata, the desired
        state, and failures.
      tags: [Torrents]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The torrent.
          headers:
            ETag:
              $ref: '#/components/headers/StateETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Torrent'
              examples:
                downloading:
                  summary: A torrent with metadata
                  value:
                    id: trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                    name: Example Collection
                    info_hashes:
                      - algorithm: sha1
                        value: 0123456789abcdef0123456789abcdef01234567
                    observed_state: downloading
                    storage_mode: memory
                    size_bytes: 1073740800
                    file_count: 1
                    created_at: '2026-10-19T12:00:00Z'
                    failure: null
                    storage_transition: null
                    storage_failure: null
                    title: Example Film
                    kind: movie
                    year: 2026
                    description: A short invented film for the examples.
                    categories: [Movies, Kids]
                    genres: [Animation, Comedy]
                    poster:
                      media_type: image/jpeg
                      size_bytes: 48213
                      updated_at: '2026-10-19T12:05:00Z'
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
                      configuration: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration
                      files: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/files
                      statistics: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/statistics
                      poster: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/poster
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    delete:
      operationId: deleteTorrent
      summary: Delete a torrent
      description: >-
        Removes a torrent, durably: it does not return after a restart. Its
        streams in progress are canceled individually, and its cached pieces
        are released in the background, which /api/v1/cache/statistics
        reflects. A torrent in disk storage, or in a transition to or from it,
        also loses its data: its directory in the download directory is
        deleted, files included. Copy files out first to keep them.
      tags: [Torrents]
      responses:
        '204':
          description: The torrent was removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /api/v1/torrents/{torrent_id}/configuration:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
    get:
      operationId: getTorrentConfiguration
      summary: Read a torrent's configuration
      description: Returns the writable configuration of a torrent.
      tags: [Torrents]
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The configuration.
          headers:
            ETag:
              $ref: '#/components/headers/ConfigurationETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentConfiguration'
              examples:
                started:
                  summary: A started torrent
                  value:
                    desired_state: started
                    storage_mode: memory
                    title: Example Film
                    kind: null
                    year: 2026
                    description: A short invented film for the examples.
                    categories: [Movies, Kids]
                    genres: [Animation, Comedy]
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration
                      torrent: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    patch:
      operationId: updateTorrentConfiguration
      summary: Change a torrent's configuration
      description: >-
        Applies a JSON merge patch to the configuration. The request must
        carry If-Match with the configuration's current ETag. The change is
        stored before this returns, and the configuration and its ETag survive
        restarts. Pausing closes the torrent's peer connections and cancels its
        streams; pausing and then starting a failed torrent restarts it. The
        observed state follows once the engine applies the change. A change of
        storage_mode starts a storage mode transition, which the torrent
        resource's storage_transition shows; streams continue across it. A
        transition that fails returns storage_mode to the storage mode in
        effect, with a new ETag, and the torrent resource's storage_failure
        says why. Changing storage_mode during a transition is
        lifecycle-conflict. The library members, title through genres, need
        no engine and change only the configuration and the torrent's
        representation; docs/lifecycle.md describes how they are normalized.
      tags: [Torrents]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: >-
          The configuration members to change, in a body of at most 16384
          bytes. Larger bodies are content-too-large, and a body that does
          not arrive within 30 seconds is request-timeout.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TorrentConfigurationPatch'
            examples:
              pause:
                summary: Pause the torrent
                value:
                  desired_state: paused
              disk:
                summary: Keep the torrent's data on disk
                value:
                  storage_mode: disk
              organize:
                summary: Retitle the torrent, replace its categories, and clear its year
                value:
                  title: Example Film
                  categories: [Movies, Kids]
                  year: null
      responses:
        '200':
          description: The updated configuration.
          headers:
            ETag:
              $ref: '#/components/headers/ConfigurationETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TorrentConfiguration'
              examples:
                paused:
                  summary: A paused torrent
                  value:
                    desired_state: paused
                    storage_mode: memory
                    title: Example Film
                    kind: null
                    year: 2026
                    description: A short invented film for the examples.
                    categories: [Movies, Kids]
                    genres: [Animation, Comedy]
                    links:
                      self: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula/configuration
                      torrent: /api/v1/torrents/trr_7ndq4m2kzb6hxw3rjpt5yc4ula
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '409':
          $ref: '#/components/responses/LifecycleConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableConfiguration'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
        '507':
          $ref: '#/components/responses/InsufficientStorage'

  /api/v1/torrents/{torrent_id}/poster:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
    get:
      operationId: getTorrentPoster
      summary: Read a torrent's poster
      description: >-
        Returns the poster image as it was uploaded, with its media type. The
        request is not-found while the torrent has no poster. A Range header
        is ignored. The poster is read from the database, so it needs no
        engine and works before metadata is available.
      tags: [Posters]
      security:
        - {}
        - accessToken: []
        - playbackToken: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The poster image.
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/PosterETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
          content:
            image/avif:
              schema:
                type: string
                contentMediaType: image/avif
            image/gif:
              schema:
                type: string
                contentMediaType: image/gif
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    head:
      operationId: headTorrentPoster
      summary: Read a torrent's poster headers
      description: Returns the headers and status a GET would return, without a body.
      tags: [Posters]
      security:
        - {}
        - accessToken: []
        - playbackToken: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The poster image's headers.
          headers:
            Content-Length:
              $ref: '#/components/headers/ContentLength'
            ETag:
              $ref: '#/components/headers/PosterETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptions'
            Content-Security-Policy:
              $ref: '#/components/headers/ContentSecurityPolicy'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    put:
      operationId: putTorrentPoster
      summary: Upload a torrent's poster
      description: >-
        Stores the image as the torrent's poster, replacing any poster it
        had. The server never fetches images itself; a client with an image
        URL downloads it and uploads the bytes. The image is stored before
        this returns, survives restarts, and is deleted with the torrent. The
        bytes must be an image of the type the Content-Type names, which the
        server checks by its signature; it does not decode or convert it. The
        last of concurrent uploads wins.
      tags: [Posters]
      requestBody:
        description: >-
          The image, at most 1048576 bytes. Larger bodies are
          content-too-large, and a body that does not arrive within 30 seconds
          is request-timeout.
        required: true
        content:
          image/avif:
            schema:
              type: string
              contentMediaType: image/avif
          image/gif:
            schema:
              type: string
              contentMediaType: image/gif
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/png:
            schema:
              type: string
              contentMediaType: image/png
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
      responses:
        '201':
          description: The torrent had no poster, and this one was stored.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/PosterETag'
        '204':
          description: The torrent's poster was replaced.
          headers:
            ETag:
              $ref: '#/components/headers/PosterETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableImage'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
    delete:
      operationId: deleteTorrentPoster
      summary: Delete a torrent's poster
      description: Removes the poster, durably. The torrent itself is unchanged.
      tags: [Posters]
      responses:
        '204':
          description: The poster was removed.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'

  /api/v1/torrents/{torrent_id}/files:
    parameters:
      - $ref: '#/components/parameters/TorrentId'
    get:
      operationId: listTorrentFiles
      summary: List a torrent's files
      description: >-
        Returns a page of the files in a torrent's metadata, in metadata
        order. Before metadata is available, the request is a
        lifecycle-conflict.
      tags: [Files]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
