[package]
name = "torrplay-mcp"
version = "0.1.0"
description = "TorrPlay's MCP server of docs/mcp.md, a client of the native API."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
torrplay-api.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
torrplay-core = { workspace = true, features = ["fake"] }
torrplay-fixtures.workspace = true
torrplay-server.workspace = true
torrplay-store.workspace = true
