[package]
name = "torrplay-store"
version = "0.1.0"
description = "TorrPlay's persistent store of torrents, in SQLite as ADR 8 decides."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# A switch that makes every write fail, for tests of failure paths.
test-support = []

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
torrplay-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The crate itself with its test support, for its integration tests.
torrplay-store = { path = ".", features = ["test-support"] }
