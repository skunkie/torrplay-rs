[package]
name = "torrplay"
version = "0.1.0"
description = "Torrent streaming server with a web client, DLNA, and a command line"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["client"]
# Serves the web client from client/dist, which `pnpm build` writes; a
# release build embeds it and fails without it, and a debug build reads it
# at runtime.
client = ["dep:rust-embed"]

# The service edition's Linux package, which ADR 13 decides: `torrplay` as a system
# service with its client, built first from the desktop workspace, the files in
# packaging/linux, and the manual pages, which scripts/build-man-pages.sh renders to
# target/man first. `cargo deb --no-build -p torrplay` packages a release build. The
# client is built into desktop/target/client, since the application's build writes
# the same file in desktop/target, which would otherwise be packaged in its place.
[package.metadata.deb]
name = "torrplay-service"
# Debian wants an address here, which the project gets when it moves to its own name
# and repository, before an apt repository publishes this; lintian flags it until then.
maintainer = "TorrPlay"
copyright = "2026 TorrPlay"
license-file = ["../../LICENSES/MIT.txt", "0"]
extended-description = """\
TorrPlay streams torrents to browsers, players, and televisions. This is its \
service edition: the TorrPlay service, which starts at boot as the torrplay \
account and serves the API, the web client, and a DLNA media server, and \
TorrPlay Client, a window on the service's page. The service's settings are in \
/etc/torrplay/torrplay.env and its library in /var/lib/torrplay, which removing \
the package keeps."""
section = "net"
priority = "optional"
depends = "$auto, systemd (>= 254)"
# The client plays video in its page through WebKitGTK, which loads GStreamer's
# plugins at run time, where $auto cannot see them.
recommends = "gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav"
# One edition per computer: the application's package uses the same port.
conflicts = "torrplay"
# cargo-deb writes its systemd and sysusers steps into maintainer scripts only when
# this names a directory. Its preinst refuses to install over a hand installation;
# the other scripts are generated whole.
maintainer-scripts = "../../packaging/linux"
assets = [
    ["target/release/torrplay", "usr/bin/", "755"],
    ["../../desktop/target/client/release/torrplay-desktop", "usr/bin/torrplay-client", "755"],
    ["../../packaging/linux/torrplay.sysusers", "usr/lib/sysusers.d/torrplay.conf", "644"],
    ["../../packaging/linux/torrplay.env", "etc/torrplay/torrplay.env", "644"],
    ["../../packaging/linux/torrplay.firewalld.xml", "usr/lib/firewalld/services/torrplay.xml", "644"],
    ["../../packaging/linux/torrplay.ufw", "etc/ufw/applications.d/torrplay", "644"],
    ["../../packaging/linux/org.torrplay.client.desktop", "usr/share/applications/", "644"],
    ["../../desktop/icons/icon.png", "usr/share/icons/hicolor/512x512/apps/org.torrplay.client.png", "644"],
    ["../../target/man/torrplay.1.gz", "usr/share/man/man1/", "644"],
    ["../../target/man/torrplay-client.1.gz", "usr/share/man/man1/", "644"],
    ["../../target/man/torrplay.env.5.gz", "usr/share/man/man5/", "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "../../packaging/linux"
unit-name = "torrplay"
enable = true
start = true
restart-after-upgrade = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
directories.workspace = true
rust-embed = { workspace = true, optional = true }
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
torrplay-core.workspace = true
torrplay-dlna.workspace = true
torrplay-engine.workspace = true
torrplay-mcp.workspace = true
torrplay-server.workspace = true
torrplay-store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
# The service edition's Windows service and its settings file.
torrplay-settings-file.workspace = true
windows-service.workspace = true

[dev-dependencies]
h2.workspace = true
reqwest = { workspace = true, features = ["http2"] }
torrplay-engine = { workspace = true, features = ["faults", "test-support"] }
torrplay-fixtures.workspace = true
# The MCP scenario runs the executable.
tokio = { workspace = true, features = ["process"] }
# The backup scenario edits an archive the application wrote.
zip.workspace = true
