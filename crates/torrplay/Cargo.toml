[package]
name = "torrplay"
version = "0.1.0"
description = "The TorrPlay application: the HTTP server over the librqbit engine."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
directories.workspace = true
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
torrplay-core.workspace = true
torrplay-dlna.workspace = true
torrplay-engine.workspace = true
torrplay-mcp.workspace = true
torrplay-server.workspace = true
torrplay-store.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
h2.workspace = true
reqwest = { workspace = true, features = ["http2"] }
torrplay-engine = { workspace = true, features = ["faults", "test-support"] }
torrplay-fixtures.workspace = true
# The MCP scenario runs the executable.
tokio = { workspace = true, features = ["process"] }
