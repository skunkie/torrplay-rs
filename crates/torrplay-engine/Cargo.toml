[package]
name = "torrplay-engine"
version = "0.1.0"
description = "The TorrPlay engine: the piece cache and the librqbit adapter behind the engine facade."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bencode.workspace = true
librqbit.workspace = true
librqbit-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
torrplay-core.workspace = true
tracing.workspace = true

[features]
# Lets tests make a torrent's storage fail, as LIF-06 needs.
faults = []

[dev-dependencies]
tempfile.workspace = true
torrplay-fixtures.workspace = true

[[test]]
name = "storage_failure"
required-features = ["faults"]
