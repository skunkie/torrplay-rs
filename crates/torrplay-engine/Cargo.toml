[package]
name = "torrplay-engine"
version = "0.1.0"
description = "The TorrPlay engine: the piece cache and the librqbit adapter behind the engine facade."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bencode.workspace = true
librqbit.workspace = true
librqbit-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile = { workspace = true, optional = true }
torrplay-core.workspace = true
torrplay-fixtures = { workspace = true, optional = true }
tracing.workspace = true

[features]
# Lets tests make a torrent's storage fail, as LIF-06 needs.
faults = []
# Local seeders for tests in this and other crates.
test-support = ["dep:tempfile", "dep:torrplay-fixtures"]

[dev-dependencies]
tempfile.workspace = true
# The crate itself with its test support, for its integration tests.
torrplay-engine = { path = ".", features = ["test-support"] }
torrplay-fixtures.workspace = true

[[test]]
name = "storage_failure"
required-features = ["faults"]
